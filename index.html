function waybillHTML(o){const sh=shopOf(o.shop);return `<div class="waybill" style="margin-bottom:16px"><div class="wr row between"><b style="font-size:16px">GHN</b><b>Rõ<span style="color:#D3243B">.</span> Express</b></div>
 <div class="wr"><div class="barcode"></div><div style="text-align:center;font-weight:700;letter-spacing:2px">GHN${o.id.slice(-6)}</div></div>
 <div class="wr"><b>TỪ:</b> ${esc(sh.name)}<br>${esc(S.s.setup.warehouse)}</div><div class="wr"><b>ĐẾN:</b> ${esc(o.buyer.name)}, ${esc(o.buyer.phone)}<br>${esc(o.buyer.line)}</div>
 <div class="wr">${o.items.map(i=>`${esc(P(i.pid).name)} ${i.variant?'('+i.variant+')':''} x${i.qty}`).join('<br>')}</div>
 <div class="wr row between"><span>Mã đơn: <b>${o.id}</b></span><span>Thu hộ (COD): <b>${o.pay==='COD'?fmt(total(o)):'0đ'}</b></span></div><div class="wr" style="border:0;font-size:10px">Cho xem hàng, không cho thử · Ngày in ${new Date().toLocaleDateString('vi-VN')}</div></div>`}
function printWaybills(ids){const os=ids.map(id=>S.orders.find(o=>o.id===id)).filter(Boolean);os.forEach(o=>o.printed=true);
  openModal(mHead(`Phiếu giao hàng (${os.length})`)+`<div class="modal-b"><div class="print-area">${os.map(waybillHTML).join('')}</div></div><div class="modal-f"><button class="btn ghost" onclick="window.print()">${ic('print','sm')} In (Ctrl+P)</button><button class="btn pri" onclick="handover(${J(ids)})">Đã đóng gói, bàn giao ĐVVC</button></div>`);save()}
function handover(ids){ids.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&o.status==='cho_lay_hang')setStatus(id,'dang_giao')});closeModal();UI.tmp.sel=[];toast(`Đã bàn giao ${ids.length} đơn cho đơn vị vận chuyển`,'truck');if(UI.timer&&UI.timer.i===4)stopTimer(false,'Đã xác nhận đơn và in phiếu giao');refresh('s')}

/* ---- Chi tiết đơn ---- */
SS.orderDetail=p=>{const o=S.orders.find(x=>x.id===p.id);if(!o)return SS.orders({});if(o.isNew){o.isNew=false}
  const n=orderNet(o);const sh=shopOf(o.shop);const kn=S.complaints.find(k=>k.order===o.id);
  const fees=o.items.map(i=>feeCalc(i.price*i.qty,P(i.pid).cat,{freeship:sh.freeship})).reduce((a,f)=>({fixed:a.fixed+f.fixed,pay:a.pay+f.pay,fs:a.fs+f.fs,tax:a.tax+f.tax}),{fixed:0,pay:0,fs:0,tax:0});
  const esc2={cho_xac_nhan:['Sàn đang giữ','warn'],cho_lay_hang:['Sàn đang giữ','warn'],dang_giao:['Sàn đang giữ','warn'],da_giao:['Chờ người mua xác nhận (tự động sau 3 ngày)','warn'],hoan_thanh:['Đã giải ngân vào số dư','ok'],tra_hang:['Tạm giữ, đang xử lý khiếu nại','err'],da_hoan_tien:['Đã hoàn cho người mua','gray'],da_huy:['Đã hoàn cho người mua','gray']}[o.status];
  let act='';
  if(o.status==='cho_xac_nhan')act=`<button class="btn pri block" onclick="sConfirm('${o.id}')">${ic('check','sm')} Xác nhận đơn</button><button class="btn danger block mt8" onclick="sCancelAsk('${o.id}')">Hủy đơn (hết hàng)</button>`;
  else if(o.status==='cho_lay_hang')act=`<button class="btn pri block" onclick="printWaybills(['${o.id}'])">${ic('print','sm')} In phiếu giao hàng</button><div class="xs muted mt8">${o.printed?'✓ Đã in phiếu':'Chưa in phiếu'} · ĐVVC lấy hàng trước 18:00</div>`;
  else if(o.status==='dang_giao')act=`<button class="btn sim block" onclick="setStatus('${o.id}','da_giao');toast('Mô phỏng: giao thành công','truck');refresh('s')">Mô phỏng: ĐVVC giao thành công</button>`;
  else if(o.status==='da_giao')act=`<div class="alert warn">${ic('clock','sm')}<div>Chờ người mua xác nhận. Tiền tự động giải ngân sau 3 ngày nếu không có khiếu nại.</div></div><button class="btn sim block mt8" onclick="setStatus('${o.id}','hoan_thanh');toast('Mô phỏng: người mua xác nhận');refresh('s')">Mô phỏng: người mua xác nhận</button>`;
  else if(o.status==='tra_hang')act=`<button class="btn pri block" onclick="go('s','returns',{id:'${kn?kn.id:''}'})">Xử lý yêu cầu trả hàng</button>`;
  return{title:`Đơn ${o.id}`,actions:pill(o.status)+` <button class="btn ghost sm" onclick="go('s','chat',{id:(S.threads.find(t=>t.shop==='${o.shop}'&&t.buyer==='${esc(o.buyer.name)}')||{}).id})">${ic('chat','sm')} Chat người mua</button>`,
  body:`<div class="grid g-main"><div class="col gap16">
   <div class="card"><div class="card-h"><h3>Sản phẩm</h3></div><table class="tbl"><thead><tr><th>Sản phẩm</th><th class="num">Đơn giá</th><th class="num">SL</th><th class="num">Thành tiền</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${miniP(P(i.pid),i.variant)}</td><td class="num">${fmt(i.price)}</td><td class="num">${i.qty}</td><td class="num">${fmt(i.price*i.qty)}</td></tr>`).join('')}</tbody></table></div>
   <div class="grid g2"><div class="card"><div class="card-h"><h3>Người mua</h3></div><div class="b">${esc(o.buyer.name)}</div><div class="sm muted">${esc(o.buyer.phone)}</div><div class="sm mt8">${esc(o.buyer.line)}</div></div>
    <div class="card"><div class="card-h"><h3>Vận chuyển</h3></div><div class="sm">GHN · ${o.ship>15000?'Hỏa tốc 2h':'Tiêu chuẩn'}</div><div class="sm muted">${['dang_giao','da_giao','hoan_thanh'].includes(o.status)?'Mã vận đơn GHN'+o.id.slice(-6):'Chưa bàn giao'}</div><div class="sm mt8">Thanh toán: <b>${esc(o.pay)}</b></div></div></div>
   <div class="card"><div class="card-h"><h3>Lịch sử đơn hàng</h3></div><div class="tl">${o.log.map(l=>`<div>${esc(l.text)}<div class="xs faint">${dt(l.t)}</div></div>`).join('')}</div></div></div>
  <div class="col gap16"><div class="card"><div class="card-h"><h3>Thao tác</h3></div>${act||'<div class="muted sm">Không có thao tác cần làm.</div>'}</div>
   <div class="card"><div class="card-h"><h3>Tiền đơn hàng</h3><span class="bdg ${esc2[1]==='ok'?'fast':esc2[1]==='err'?'err':esc2[1]==='gray'?'gray':'warn'}">${esc2[0]}</span></div>
   <div class="fee-row"><span>Tiền hàng</span><b>${fmt(sub(o))}</b></div>${o.vShop?`<div class="fee-row"><span>Voucher shop (shop chịu)</span><span>-${fmt(o.vShop)}</span></div>`:''}${o.vPlat||o.shipDisc||o.xu?`<div class="fee-row"><span>Voucher sàn / freeship / xu (sàn chịu)</span><span class="faint">${fmt(o.vPlat+o.shipDisc+o.xu)}</span></div>`:''}
   <div class="fee-row"><span>Phí cố định</span><span>-${fmt(fees.fixed)}</span></div><div class="fee-row"><span>Phí thanh toán</span><span>-${fmt(fees.pay)}</span></div><div class="fee-row"><span>Phí Freeship</span><span>-${fmt(fees.fs)}</span></div><div class="fee-row"><span>Thuế khấu trừ</span><span>-${fmt(fees.tax)}</span></div>
   <div class="fee-row" style="font-size:15px"><b>Thực nhận</b><b style="color:var(--brand)">${fmt(n.net)}</b></div></div></div></div>`}};
function sCancelAsk(id){openModal(mHead('Hủy đơn '+id)+`<div class="modal-b"><div class="alert err">${ic('alert','sm')}<div>Shop hủy đơn vì hết hàng sẽ bị <b>trừ 1 điểm uy tín</b> (hiện ${S.s.reputation}/100). Người mua được hoàn tiền 100% và nhận thông báo.</div></div><label class="label mt12">Lý do</label><select class="select" id="cr"><option>Hết hàng</option><option>Sai giá niêm yết</option><option>Không liên lạc được người mua</option></select></div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Không hủy</button><button class="btn danger" onclick="const r=$('#cr').value;setStatus('${id}','da_huy','Shop hủy, '+r);S.s.reputation--;closeModal();toast('Đã hủy đơn. Điểm uy tín: '+S.s.reputation,'alert');refresh('s')">Xác nhận hủy</button></div>`)}

/* ---- Đổi trả ---- */
SS.returns=p=>{const list=S.complaints.filter(k=>k.shop===myShop());const cur=list.find(k=>k.id===p.id)||list[0];
  const lbl={cho_shop:['Chờ shop phản hồi','warn'],cho_san:['Sàn đang phân xử','auth'],da_hoan:['Đã hoàn tiền','gray'],tu_choi:['Sàn từ chối yêu cầu','fast']};
  return{title:'Xử lý đổi trả',body:list.length?`<div class="grid" style="grid-template-columns:320px minmax(0,1fr)"><div class="card" style="padding:0;overflow:hidden">${list.map(k=>`<button class="listrow" style="${cur&&cur.id===k.id?'background:var(--brand-50)':''}" onclick="go('s','returns',{id:'${k.id}'},true)"><div class="grow"><div class="row between"><b>${k.id}</b><span class="bdg ${lbl[k.status][1]}">${lbl[k.status][0]}</span></div><div class="xs muted">${k.order} · ${esc(k.buyer)}</div><div class="xs">${esc(k.reason)}</div></div></button>`).join('')}</div>
  ${cur?(()=>{const o=S.orders.find(x=>x.id===cur.order);const x=P(o.items[0].pid);return `<div class="card"><div class="card-h"><h3>${cur.id} · Đơn ${cur.order}</h3><span class="bdg ${lbl[cur.status][1]}">${lbl[cur.status][0]}</span></div>
   ${cur.status==='cho_shop'?`<div class="alert warn">${ic('clock','sm')}<div>Hạn phản hồi: <b>còn ${Math.max(1,48-Math.floor((Date.now()-cur.created)/3600e3))} giờ</b>. Quá hạn, Sàn sẽ tự động hoàn tiền cho người mua.</div></div>`:''}
   <div class="grid g2 mt12"><div>${miniP(x,o.items[0].variant+' x'+o.items[0].qty)}<div class="kv sm mt12"><span>Người mua</span><b>${esc(cur.buyer)}</b></div><div class="kv sm"><span>Lý do</span><b>${esc(cur.reason)}</b></div><div class="kv sm"><span>Số tiền yêu cầu hoàn</span><b class="price">${fmt(cur.amount)}</b></div></div>
   <div><div class="label">Mô tả của người mua</div><p class="sm">“${esc(cur.desc)}”</p><div class="label mt12">Bằng chứng (${cur.photos} ảnh)</div><div class="thumbs">${Array(cur.photos).fill(0).map((_,i)=>`<div style="width:72px">${pimg({...x,_k:i+1},{e:26})}</div>`).join('')}</div></div></div>
   ${cur.sellerResp?`<div class="seller-reply mt12"><b>Phản hồi của shop:</b> ${esc(cur.sellerResp)}</div>`:''}
   <div class="divider"></div><div class="label">Tiến trình</div><div class="tl">${[...cur.log].reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div>
   ${cur.status==='cho_shop'?`<div class="row mt16" style="justify-content:flex-end"><button class="btn ghost" onclick="sRejectAsk('${cur.id}')">Từ chối & gửi bằng chứng lên Sàn</button><button class="btn pri" onclick="sAcceptReturn('${cur.id}')">Đồng ý hoàn tiền ${fmt(cur.amount)}</button></div>`:''}</div>`})():''}</div>`
  :`<div class="card"><div class="empty"><div class="art"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>Không có yêu cầu trả hàng nào</div></div>`}};
function refundOrder(k,amount,by){const o=S.orders.find(x=>x.id===k.order);k.status='da_hoan';k.refund=amount;k.log.push(`${by}, hoàn ${fmt(amount)} cho người mua`);o.status='da_hoan_tien';addLog(o,`Đã hoàn ${fmt(amount)} cho người mua (${k.id}).`);
  if(o.buyerId==='u1')notify('b',`Yêu cầu <b>${k.id}</b> đã được chấp nhận. Hoàn <b>${fmt(amount)}</b> về ${esc(k.method||'nguồn thanh toán')}.`,['orderDetail',{id:o.id}],'wallet')}
function sAcceptReturn(id){const k=S.complaints.find(x=>x.id===id);refundOrder(k,k.amount,'Shop đồng ý hoàn tiền');notify('a',`Shop đã đồng ý hoàn tiền <b>${k.id}</b>`,['complaints',{id}]);toast('Đã đồng ý hoàn tiền, người mua được thông báo');refresh('s')}
function sRejectAsk(id){openModal(mHead('Từ chối yêu cầu '+id)+`<div class="modal-b"><p class="sm muted">Yêu cầu sẽ được chuyển lên Sàn phân xử. Tiền vẫn do Sàn giữ trong thời gian xử lý.</p><label class="label mt12">Lý do & bằng chứng của shop</label><textarea class="textarea" id="rj" placeholder="Ví dụ: Video đóng gói cho thấy sản phẩm nguyên vẹn khi gửi"></textarea><button class="btn ghost sm mt8" onclick="this.textContent='✓ Đã đính kèm video_dong_goi.mp4'">${ic('camera','sm')} Đính kèm video đóng gói</button></div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="const k=S.complaints.find(x=>x.id==='${id}');k.status='cho_san';k.sellerResp=$('#rj').value||'Shop từ chối, đã gửi video đóng gói.';k.log.push('Shop từ chối, chuyển lên Sàn xử lý');notify('a','Khiếu nại <b>${id}</b> được shop từ chối, cần Sàn phân xử',['complaints',{id:'${id}'}]);const o=S.orders.find(x=>x.id===k.order);if(o.buyerId==='u1')notify('b','Shop đã phản hồi yêu cầu <b>${id}</b>. Sàn sẽ phân xử trong 3 ngày làm việc.',['orderDetail',{id:o.id}]);closeModal();toast('Đã chuyển lên Sàn');refresh('s')">Gửi lên Sàn</button></div>`)}

/* ---- Voucher & Flash Sale ---- */
SS.marketing=p=>{const tab=p.tab||'voucher';const fs=S.campaigns.find(c=>c.id==='C-FS');const mine=S.campaigns.flatMap(c=>c.regs.filter(r=>r.shop===myShop()).map(r=>({...r,camp:c})));
  let body='';
  if(tab==='voucher')body=`<div class="grid g-main"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mã</th><th>Giảm</th><th class="num">Đơn tối thiểu</th><th>Đã dùng</th><th>Hạn</th><th></th></tr></thead><tbody>${S.s.vouchers.map((v,i)=>`<tr><td><b>${v.code}</b></td><td>${v.type==='pct'?v.val+'%'+(v.cap?' (tối đa '+fmtK(v.cap)+')':''):fmt(v.val)}</td><td class="num">${fmt(v.min)}</td><td style="min-width:140px"><div class="prog" style="background:var(--brand-50)"><i style="width:${v.used/v.qty*100}%;background:var(--brand)"></i></div><span class="xs muted">${v.used}/${v.qty}</span></td><td>${v.end}</td><td><button class="btn ghost sm" onclick="S.s.vouchers.splice(${i},1);toast('Đã kết thúc voucher');refresh('s')">Kết thúc</button></td></tr>`).join('')}</tbody></table></div>
   <div class="card"><div class="card-h"><h3>Tạo voucher shop</h3></div><div class="field"><label class="label">Mã voucher</label><input class="input" id="vc" value="HP${Math.floor(Math.random()*90+10)}OFF"></div><div class="grid g2"><div class="field"><label class="label">Loại</label><select class="select" id="vt"><option value="amt">Giảm số tiền</option><option value="pct">Giảm %</option></select></div><div class="field"><label class="label">Mức giảm</label><input class="input" id="vv" value="30000"></div></div><div class="grid g2"><div class="field"><label class="label">Đơn tối thiểu</label><input class="input" id="vm" value="500000"></div><div class="field"><label class="label">Số lượng</label><input class="input" id="vq" value="100"></div></div>
   <button class="btn pri block" onclick="const t=$('#vt').value,v=+$('#vv').value;S.s.vouchers.unshift({code:$('#vc').value.toUpperCase(),name:t==='pct'?'Giảm '+v+'%':'Giảm '+fmtK(v).toString().toUpperCase(),type:t,val:v,cap:t==='pct'?100000:0,min:+$('#vm').value,qty:+$('#vq').value,used:0,end:'31/10/2026'});toast('Đã tạo voucher, người mua thấy ngay trong giỏ hàng','tag');refresh('s')">Tạo voucher</button><p class="xs muted mt8">Voucher shop do shop chịu chi phí và được trừ vào tiền thực nhận.</p></div></div>`;
  if(tab==='flash')body=`<div class="grid g4" style="margin-bottom:16px">${kpi('Sản phẩm đang Flash Sale',mine.filter(r=>r.camp.id==='C-FS').length)}${kpi('Lượt nhấp',S.s.stats.clicks.toLocaleString('vi-VN'),'▲ 18% tuần này','up')}${kpi('Lượt đặt “Nhắc tôi”',S.s.stats.reminds.toLocaleString('vi-VN'))}${kpi('Tồn kho đang khóa',mine.reduce((a,r)=>a+r.qty,0)+' sp','Khóa riêng cho chương trình')}</div>
   <div class="grid g-main"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sản phẩm</th><th>Chương trình</th><th>Khung giờ</th><th class="num">Giá flash</th><th class="num">Suất (khóa kho)</th><th>Trạng thái</th></tr></thead><tbody>${mine.map(r=>`<tr><td>${miniP(P(r.pid),'Giá thường '+fmt(P(r.pid).price))}</td><td class="sm">${esc(r.camp.name)}</td><td>${r.slot==='now'?slotNow():r.slot==='next'?slotNext():r.slot}</td><td class="num price">${fmt(r.flash)}</td><td class="num">${r.qty}</td><td><span class="bdg ${r.slot==='now'?'acc':'ver'}">${r.slot==='now'?'Đang diễn ra':'Sắp diễn ra'}</span></td></tr>`).join('')}</tbody></table></div>
   <div class="card"><div class="card-h"><h3>Tạo Flash Sale của shop</h3></div>${regForm('C-FS',[slotNext()])}</div></div>`;
  if(tab==='camp')body=`<div class="col gap16">${S.campaigns.filter(c=>c.id!=='C-FS').map(c=>`<div class="card"><div class="card-h"><div><h3>${esc(c.name)}</h3><div class="xs muted">${c.type} · ${c.start}${c.end!==c.start?' – '+c.end:''} · hạn đăng ký ${c.deadline} · giảm tối thiểu ${c.minDisc}%</div></div><span class="bdg ${c.status==='Đang mở đăng ký'?'ver':'gray'}">${c.status}</span></div>
    <div class="grid g-main"><div><div class="label">Sản phẩm shop đã đăng ký</div>${c.regs.filter(r=>r.shop===myShop()).map(r=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)">${miniP(P(r.pid),'Khung '+r.slot+' · '+r.qty+' suất')}<b class="price">${fmt(r.flash)}</b></div>`).join('')||'<p class="muted sm">Chưa đăng ký sản phẩm nào.</p>'}</div>
    ${c.status==='Đang mở đăng ký'?`<div style="border-left:1px solid var(--line);padding-left:16px">${regForm(c.id,c.slots)}</div>`:''}</div></div>`).join('')}</div>`;
  return{title:'Voucher & Flash Sale',body:tabsBar('s','marketing',[['voucher','Voucher của shop'],['flash','Flash Sale của shop'],['camp','Chương trình của sàn']],tab)+`<div style="border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px;background:var(--bg)">${body}</div>`}};
function regForm(cid,slots){const c=S.campaigns.find(x=>x.id===cid);const ps=sProducts().filter(p=>p.status==='dang_ban');const fid='rf'+cid.replace(/\W/g,'');
  return `<div class="field"><label class="label">Sản phẩm</label><select class="select" id="${fid}p" onchange="const p=P(this.value);$('#${fid}f').value=Math.round(Math.min(...p.history)*(1-${c.minDisc}/100)/1000)*1000">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}, ${fmt(p.price)}</option>`).join('')}</select></div>
  <div class="grid g3"><div class="field"><label class="label">Khung giờ</label><select class="select" id="${fid}s">${slots.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label class="label">Giá flash</label><input class="input" id="${fid}f" value="${ps[0]?Math.round(Math.min(...ps[0].history)*(1-c.minDisc/100)/1000)*1000:''}"></div><div class="field"><label class="label">Số suất</label><input class="input" id="${fid}q" value="50"></div></div>
  <div class="alert info">${ic('lock','sm')}<div>Hệ thống <b>khóa tồn kho</b> cho số suất đăng ký. Giá flash phải thấp hơn giá thấp nhất 30 ngày ít nhất ${c.minDisc}%.</div></div>
  <button class="btn pri block mt12" onclick="registerFlash('${cid}','${fid}')">Đăng ký</button>`}
function registerFlash(cid,fid){const c=S.campaigns.find(x=>x.id===cid);const pid=$('#'+fid+'p').value,flash=+$('#'+fid+'f').value,qty=+$('#'+fid+'q').value;let slot=$('#'+fid+'s').value;const p=P(pid);const lim=Math.min(...p.history)*(1-c.minDisc/100);
  if(flash>lim){toast(`Giá flash phải ≤ ${fmt(Math.floor(lim/1000)*1000)} (thấp hơn giá thấp nhất 30 ngày ${c.minDisc}%)`,'alert');return}
  if(qty>p.stock){toast('Số suất vượt tồn kho ('+p.stock+')','alert');return}
  if(cid==='C-FS')slot='next';c.regs.push({shop:myShop(),pid,flash,qty,slot,ok:true});notify('a',`${esc(shopOf(myShop()).name)} đăng ký <b>${esc(p.name)}</b> vào ${esc(c.name)}`,['campaigns',{id:cid}]);toast('Đã đăng ký, người mua có thể bấm “Nhắc tôi”','mega');refresh('s')}

/* ---- Chat ---- */
SS.chat=p=>{const ts=S.threads.filter(t=>t.shop===myShop());const cur=ts.find(t=>t.id===p.id)||ts[0];S.notifs.forEach(n=>{if(n.role==='s'&&n.kind==='chat')n.read=true});const ar=S.s.autoReply;
  return{title:'Chat & trả lời tự động',body:`<div class="grid" style="grid-template-columns:280px minmax(0,1fr) 300px;align-items:start">
  <div class="card" style="padding:0;overflow:hidden">${ts.map(t=>{const l=t.msgs[t.msgs.length-1];return `<button class="listrow" style="${cur&&cur.id===t.id?'background:var(--brand-50)':''}" onclick="go('s','chat',{id:'${t.id}'},true)"><div class="avatar">${initials(t.buyer)}</div><div class="grow" style="min-width:0"><div class="row between"><b class="sm">${esc(t.buyer)}</b><span class="xs faint">${l?ago(l.t):''}</span></div><div class="xs muted ell">${l?esc(l.text):''}</div></div>${l&&l.from==='buyer'?'<span class="dot core"></span>':''}</button>`}).join('')}</div>
  <div class="card" style="padding:0;display:flex;flex-direction:column;min-height:480px">${cur?`<div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line)"><div class="avatar">${initials(cur.buyer)}</div><div class="grow"><b>${esc(cur.buyer)}</b><div class="xs faint">${cur.me?'Người mua đang demo bên điện thoại':'Người mua'}</div></div></div>
   <div class="msgs grow" style="background:var(--surface-2)">${cur.msgs.map(m=>`<div class="msg ${m.from==='shop'?'me':'them'}">${m.auto?'<span class="auto">Trả lời tự động</span>':''}${esc(m.text)}<span class="t">${dt(m.t)}</span></div>`).join('')}</div>
   <div style="padding:10px;border-top:1px solid var(--line)"><div class="chips">${S.s.quick.map(q=>`<button class="chip" onclick="$('#sreply').value='${esc(q)}'">${esc(q)}</button>`).join('')}</div><form class="row mt8" onsubmit="sReply('${cur.id}');return false"><input id="sreply" class="input" placeholder="Nhập tin trả lời…" autocomplete="off"><button class="btn pri">${ic('send','sm')} Gửi</button></form></div>`:'<div class="empty">Chưa có hội thoại</div>'}</div>
  <div class="card"><div class="card-h"><h3>Trả lời tự động</h3><button class="toggle ${ar.on?'on':''}" onclick="S.s.autoReply.on=!S.s.autoReply.on;refresh('s')" aria-label="Bật/tắt"></button></div><p class="xs muted">Gửi khi người mua nhắn lần đầu hoặc khi shop chưa phản hồi trong 10 phút.</p><textarea class="textarea mt8" id="artext">${esc(ar.text)}</textarea><button class="btn sec block mt8" onclick="S.s.autoReply.text=$('#artext').value;toast('Đã lưu tin trả lời tự động');refresh('s')">Lưu</button>
   <div class="divider"></div><div class="b sm">Câu trả lời nhanh</div>${S.s.quick.map((q,i)=>`<div class="row between sm" style="padding:6px 0">${esc(q)}<button class="iconbtn" style="width:28px;height:28px" onclick="S.s.quick.splice(${i},1);refresh('s')">${ic('x','sm')}</button></div>`).join('')}<form class="row mt8" onsubmit="const v=$('#nq').value.trim();if(v){S.s.quick.push(v);refresh('s')}return false"><input class="input" id="nq" placeholder="Thêm câu mới" style="min-height:36px"><button class="btn ghost sm">Thêm</button></form></div></div>`}};
function sReply(tid){const v=$('#sreply').value.trim();if(!v)return;const t=S.threads.find(x=>x.id===tid);t.msgs.push({from:'shop',text:v,t:Date.now()});if(t.me)notify('b',`<b>${esc(shopOf(t.shop).name)}</b> đã trả lời: “${esc(v.slice(0,60))}”`,['chat',{shop:t.shop}],'chat');refresh('s')}

/* ---- Đánh giá ---- */
SS.reviews=p=>{const f=p.f||'all';const all=S.reviews.filter(r=>P(r.pid)&&P(r.pid).shop===myShop()).sort((a,b)=>a.days-b.days);const list=all.filter(r=>f==='all'||(f==='noreply'?!r.reply:f==='media'?r.photos:r.stars===+f));const avg=all.reduce((a,r)=>a+r.stars,0)/(all.length||1);
  return{title:'Đánh giá từ khách',body:`<div class="grid g4" style="margin-bottom:16px">${kpi('Điểm trung bình','★ '+avg.toFixed(1))}${kpi('Tổng đánh giá',all.length)}${kpi('Chưa phản hồi',all.filter(r=>!r.reply).length)}${kpi('Có ảnh/video',all.filter(r=>r.photos).length)}</div>
  <div class="chips" style="margin-bottom:12px">${[['all','Tất cả'],['noreply','Chưa phản hồi'],['media','Có ảnh'],['5','5★'],['4','4★'],['3','3★'],['2','2★'],['1','1★']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="go('s','reviews',{f:'${k}'},true)">${l}</button>`).join('')}</div>
  <div class="card">${list.map(r=>{const i=S.reviews.indexOf(r);const x=P(r.pid);return `<div class="review"><div class="row"><div class="avatar">${initials(r.name)}</div><div class="grow"><b class="sm">${esc(r.name)}</b>${r.mine?' <span class="bdg acc">Mới</span>':''}<div class="stars">${starStr(r.stars)}</div></div><span class="xs faint">${r.days?r.days+' ngày trước':'vừa xong'}</span></div><div class="xs faint mt4">${esc(x.name)}${r.variant?' · '+r.variant:''}</div><p class="sm mt4">${esc(r.text)}</p>${r.photos?`<div class="thumbs">${Array(r.photos).fill(0).map((_,k)=>pimg({...x,_k:k+1},{e:24})).join('')}</div>`:''}
   ${r.reply?`<div class="seller-reply"><b>Phản hồi của shop:</b> ${esc(r.reply)}</div>`:`<form class="row mt8" onsubmit="const v=$('#rr${i}').value.trim();if(v){S.reviews[${i}].reply=v;toast('Đã phản hồi, hiển thị trên trang sản phẩm');refresh('s')}return false"><input id="rr${i}" class="input" style="min-height:36px" placeholder="${r.stars<=3?'Xin lỗi & đề xuất hướng xử lý…':'Cảm ơn khách hàng…'}"><button class="btn sec sm">Phản hồi</button></form>`}</div>`}).join('')||'<div class="empty">Không có đánh giá</div>'}</div>`}};

/* ---- Tài chính & đối soát ---- */
function ledger(){return sOrders().filter(o=>o.status!=='da_huy').map(o=>{const sh=shopOf(o.shop);const f=o.items.map(i=>feeCalc(i.price*i.qty,P(i.pid).cat,{freeship:sh.freeship})).reduce((a,x)=>({fixed:a.fixed+x.fixed,pay:a.pay+x.pay,fs:a.fs+x.fs,tax:a.tax+x.tax}),{fixed:0,pay:0,fs:0,tax:0});
  const st=o.status==='hoan_thanh'?'released':o.status==='da_hoan_tien'?'refunded':'held';return{o,sub:sub(o),...f,v:o.vShop,net:orderNet(o).net,st}})}
SS.finance=()=>{const L=ledger();const held=L.filter(l=>l.st==='held').reduce((a,l)=>a+l.net,0);const rel=L.filter(l=>l.st==='released').reduce((a,l)=>a+l.net,0);const BASE=61300000;const avail=BASE+rel-S.s.withdrawn;const feeSum=L.reduce((a,l)=>a+l.fixed+l.pay+l.fs+l.tax,0);
  const lbl={held:['Sàn đang giữ','warn'],released:['Đã giải ngân','fast'],refunded:['Đã hoàn người mua','gray']};
  return{title:'Tài chính & đối soát',actions:`<button class="btn ghost sm" onclick="exportCSV()">${ic('download','sm')} Xuất đối soát CSV</button><button class="btn pri sm" onclick="withdrawAsk(${avail})">${ic('wallet','sm')} Rút tiền</button>`,
  body:`<div class="grid g4">${kpi('Số dư có thể rút',fmt(avail),'Rút về Vietcombank ****6688','')}${kpi('Sàn đang giữ',fmt(held),'Giải ngân khi người mua xác nhận')}${kpi('Đã rút (tháng này)',fmt(S.s.withdrawn))}${kpi('Tổng phí các đơn bên dưới',fmt(feeSum),'Khớp 100% với bảng phí khi đăng')}</div>
  <div class="alert brand mt16">${ic('lock','sm')}<div>Luồng tiền: Người mua thanh toán → <b>Sàn giữ</b> → Người mua xác nhận đúng mô tả (hoặc tự động sau 3 ngày) → <b>Giải ngân</b> vào số dư → Rút về tài khoản ngân hàng trong 24h.</div></div>
  <div class="tbl-wrap mt16"><table class="tbl"><thead><tr><th>Mã đơn</th><th>Ngày</th><th class="num">Tiền hàng</th><th class="num">Phí cố định</th><th class="num">Phí TT</th><th class="num">Freeship</th><th class="num">Thuế</th><th class="num">Voucher shop</th><th class="num">Thực nhận</th><th>Trạng thái</th></tr></thead><tbody>
  ${L.map(l=>`<tr class="click" onclick="go('s','orderDetail',{id:'${l.o.id}'})"><td><b>${l.o.id}</b></td><td class="xs">${new Date(l.o.created).toLocaleDateString('vi-VN')}</td><td class="num">${fmt(l.sub)}</td><td class="num">-${fmt(l.fixed)}</td><td class="num">-${fmt(l.pay)}</td><td class="num">-${fmt(l.fs)}</td><td class="num">-${fmt(l.tax)}</td><td class="num">${l.v?'-'+fmt(l.v):'—'}</td><td class="num"><b>${fmt(l.net)}</b></td><td><span class="bdg ${lbl[l.st][1]}">${lbl[l.st][0]}</span></td></tr>`).join('')}</tbody></table></div>
  <div class="card mt16"><div class="card-h"><h3>Biểu phí hiện hành</h3><span class="xs muted">Cập nhật ${S.fees.updated} · thay đổi báo trước 15 ngày</span></div><div class="grid g4">${CATS.map(c=>`<div class="kv sm"><span>${c.name}</span><b>${S.fees.cats[c.id]}%</b></div>`).join('')}<div class="kv sm"><span>Phí thanh toán</span><b>${S.fees.pay}%</b></div><div class="kv sm"><span>Freeship (tự chọn)</span><b>${S.fees.freeship}% ≤ ${fmtK(S.fees.freeshipCap)}</b></div><div class="kv sm"><span>Thuế khấu trừ hộ KD</span><b>${S.fees.tax}%</b></div></div></div>`}};
function withdrawAsk(avail){openModal(mHead('Rút tiền')+`<div class="modal-b"><div class="kv"><span>Số dư khả dụng</span><b>${fmt(avail)}</b></div><label class="label mt12">Số tiền rút</label><input class="input" id="wa" value="${Math.floor(avail/1e6)*1e6}"><div class="kv sm mt12"><span>Tài khoản nhận</span><b>Vietcombank ****6688, NGUYEN VAN HUNG</b></div><div class="kv sm"><span>Phí rút</span><b>Miễn phí</b></div></div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="const a=+$('#wa').value;if(a<=0||a>${avail}){toast('Số tiền không hợp lệ','alert');return}S.s.withdrawn+=a;closeModal();toast('Đã tạo lệnh rút '+fmt(a)+', nhận trong 24h','wallet');refresh('s')">Xác nhận rút</button></div>`)}
function exportCSV(){const rows=[['Ma don','Ngay','Tien hang','Phi co dinh','Phi thanh toan','Phi freeship','Thue','Voucher shop','Thuc nhan','Trang thai']].concat(ledger().map(l=>[l.o.id,new Date(l.o.created).toLocaleDateString('vi-VN'),l.sub,Math.round(l.fixed),Math.round(l.pay),Math.round(l.fs),Math.round(l.tax),l.v,Math.round(l.net),l.st]));
  const blob=new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='doi-soat-ro.csv';a.click();toast('Đã xuất file đối soát','download')}

/* ---- Thiết lập shop ---- */
SS.setup=()=>{const sh=shopOf(myShop());const st=S.s.setup;
  return{title:'Thiết lập shop',actions:`<button class="btn pri sm" onclick="saveSetup()">Lưu thay đổi</button>`,body:`<div class="grid g-main"><div class="col gap16">
  <div class="card"><div class="card-h"><h3>Thông tin shop</h3></div><div class="grid g2"><div class="field"><label class="label">Tên shop</label><input class="input" id="su-name" value="${esc(sh.name)}"></div><div class="field"><label class="label">Logo</label><div class="row"><div class="avatar" style="width:44px;height:44px;font-size:16px">${logoHTML(sh)}</div><button class="btn ghost sm">Đổi logo</button></div></div></div>
   <div class="field"><label class="label">Giới thiệu</label><textarea class="textarea" id="su-desc">${esc(st.desc)}</textarea></div><div class="field"><label class="label">Địa chỉ kho lấy hàng</label><input class="input" id="su-wh" value="${esc(st.warehouse)}"></div><div class="field"><label class="label">Giờ làm việc</label><input class="input" id="su-h" value="${esc(st.hours)}"></div></div>
  <div class="card"><div class="card-h"><h3>Vận chuyển</h3></div>${['GHN','GHTK','Viettel Post','Hỏa tốc 2h'].map(c=>`<button class="row" style="padding:8px 0;width:100%" onclick="const a=S.s.setup.carriers,i=a.indexOf('${c}');i<0?a.push('${c}'):a.splice(i,1);refresh('s')"><span class="check ${st.carriers.includes(c)?'on':''}">${st.carriers.includes(c)?ic('check','sm'):''}</span>${c}</button>`).join('')}
   <div class="divider"></div><div class="row between"><div><b>Tham gia chương trình Freeship</b><div class="xs muted">Phí ${S.fees.freeship}% (tối đa ${fmtK(S.fees.freeshipCap)}/đơn). Sản phẩm được gắn nhãn miễn phí vận chuyển.</div></div><button class="toggle ${sh.freeship?'on':''}" onclick="S.shopOver=S.shopOver||{};S.shopOver['${sh.id}']={...(S.shopOver['${sh.id}']||{}),freeship:!${sh.freeship}};refresh('s')"></button></div></div>
  <div class="card"><div class="card-h"><h3>Chính sách đổi trả</h3></div><div class="row">${[7,15,30].map(d=>`<button class="chip ${st.returns===d?'on':''}" onclick="S.s.setup.returns=${d};refresh('s')">${d} ngày</button>`).join('')}</div><p class="xs muted mt8">Tối thiểu 15 ngày đối với lỗi nhà sản xuất theo chính sách sàn.</p></div></div>
  <div class="col gap16"><div class="card"><div class="card-h"><h3>Định danh & hồ sơ</h3></div><div class="row gap4">${sh.verified?`<span class="bdg ver">${ic('shield','sm')}Đã định danh VNeID</span>`:'<span class="bdg warn">Chưa định danh</span>'}</div><div class="kv sm mt8"><span>Chủ sở hữu</span><b>${esc(sh.owner)}</b></div><div class="kv sm"><span>Loại hình</span><b>${sh.type}</b></div><div class="kv sm"><span>MST</span><b>${sh.mst}</b></div><div class="kv sm"><span>Xác thực</span><b>${sh.vdate}</b></div><p class="xs muted mt8">Thông tin này hiển thị công khai trong tab “Hồ sơ minh bạch” của shop.</p></div>
  <div class="card"><div class="card-h"><h3>Xem trước</h3></div><div style="background:linear-gradient(135deg,hsl(${sh.hue} 45% 30%),hsl(${sh.hue} 40% 18%));color:#fff;border-radius:10px;padding:14px"><div class="row"><div class="avatar" style="font-size:15px;width:40px;height:40px">${logoHTML(sh)}</div><div><b>${esc(sh.name)}</b><div class="xs" style="opacity:.85">★ ${sh.rating} · ${fmtK(sh.follows)} theo dõi</div></div></div><p class="xs mt8" style="opacity:.9">${esc(st.desc)}</p></div><button class="btn ghost block mt8 sm" onclick="go('b','shop',{id:'${sh.id}'})">Mở trang shop bên người mua</button></div></div></div>`}};
function saveSetup(){S.s.setup.desc=$('#su-desc').value;S.s.setup.warehouse=$('#su-wh').value;S.s.setup.hours=$('#su-h').value;S.shopOver=S.shopOver||{};S.shopOver[myShop()]={...(S.shopOver[myShop()]||{}),name:$('#su-name').value};toast('Đã lưu thiết lập shop');refresh('s')}

/* ---- Đăng ký & định danh VNeID ---- */
SS.register=()=>{const ob=S.s.onboard;const d=ob.data;const st=ob.step;const steps=['Tài khoản','Định danh VNeID','Thông tin kinh doanh','Gửi duyệt'];
  if(ob.status){const ap=S.applications.find(a=>a.id===ob.appId);const ok=ob.status==='da_duyet';const bs=ob.status==='bo_sung';const rj=ob.status==='tu_choi';
    return{title:'Đăng ký & định danh',body:`<div class="card" style="max-width:720px;margin:0 auto;text-align:center;padding:32px"><div class="art" style="margin:0 auto;color:${ok?'var(--ok)':rj?'var(--err)':bs?'var(--warn)':'var(--info)'}">${ic(ok?'check':rj?'x':bs?'edit':'clock','lg')}</div><h2 class="xl bb mt8">${ok?'Shop đã được duyệt!':rj?'Hồ sơ bị từ chối':bs?'Sàn yêu cầu bổ sung hồ sơ':'Hồ sơ đang chờ Sàn duyệt'}</h2>
     <p class="muted mt8">${ok?`Shop <b>${esc(d.shopName)}</b> đã được định danh và có thể bắt đầu bán hàng.`:rj?esc(ap&&ap.note||''):bs?esc(ap&&ap.note||'Vui lòng bổ sung giấy tờ.'):'Thường được duyệt trong 24 giờ. Bạn sẽ nhận thông báo khi có kết quả.'}</p>
     <div class="dsteps mt24" style="text-align:left">${['Gửi hồ sơ','VNeID đã xác thực','Sàn kiểm tra','Bắt đầu bán'].map((s,i)=>`<div class="${i<(ok?4:2)?'done':i===2?'cur':''}"><i>${i<(ok?4:2)?'✓':i+1}</i>${s}</div>`).join('')}</div>
     ${ok?`<div class="row mt16" style="justify-content:center"><button class="btn ghost" onclick="go('s','setup')">Thiết lập shop</button><button class="btn pri" onclick="UI.tmp.ep=null;go('s','editProduct',{})">${ic('plus','sm')} Đăng sản phẩm đầu tiên</button></div>`
      :`<div class="alert warn mt16" style="text-align:left">${ic('split','sm')}<div><b>Demo:</b> chuyển sang vai trò Admin để duyệt hồ sơ <b>${ob.appId}</b>. <a href="#" onclick="go('a','shops',{id:'${ob.appId}'});return false">Mở màn hình duyệt →</a></div></div>`}
     <button class="btn ghost sm mt16" onclick="S.s.onboard={step:0,data:{},status:null};refresh('s')">Làm lại luồng đăng ký</button></div>`}}
  let body='';
  if(st===0)body=`<h3 class="lg bb">Tạo tài khoản người bán</h3><p class="muted sm mt4">Một số điện thoại = một tài khoản người bán.</p><div class="grid g2 mt16"><div class="field"><label class="label">Số điện thoại *</label><input class="input" id="ob-ph" value="${esc(d.phone||'0909 888 123')}"></div><div class="field"><label class="label">Email *</label><input class="input" id="ob-em" value="${esc(d.email||'hung.giadung@gmail.com')}"></div></div><div class="field"><label class="label">Mã OTP</label><div class="row"><input class="input" id="ob-otp" value="${esc(d.otp||'')}" placeholder="6 chữ số" style="max-width:200px"><button class="btn ghost" onclick="$('#ob-otp').value='123456';toast('Mã demo: 123456')">Gửi mã</button></div></div>

function submitOnboard(){const d=S.s.onboard.data;const id='AP-'+(504+S.applications.length);

  S.s.onboard.status='cho_duyet';S.s.onboard.appId=id;notify('a',`Hồ sơ shop mới <b>${esc(d.shopName)}</b> chờ duyệt định danh`,['shops',{id}]);toast('Đã gửi hồ sơ '+id);refresh('s')}

  <div class="grid g3">
   <div><div class="row between b sm">${ic('id','sm')} Shop chờ duyệt (${aps.length})<button class="link xs" onclick="go('a','shops',{})">Tất cả</button></div>${aps.map(a=>`<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px"><div class="row between"><b class="sm">${esc(a.name)}</b>${riskBdg(a.risk)}</div><div class="xs muted">${esc(a.owner)} · ${a.type} · ${ago(a.submitted)}</div><div class="xs mt4">${a.vneid.ok?'<span style="color:var(--ok)">✓ VNeID</span>':'<span style="color:var(--err)">✗ VNeID</span>'} · ${a.mstOk?'<span style="color:var(--ok)">✓ MST</span>':'<span style="color:var(--warn)">! MST chưa khớp</span>'}</div><div class="row mt8"><button class="btn ghost sm grow" onclick="go('a','shops',{id:'${a.id}'})">Xem</button>${a.vneid.ok&&a.mstOk?`<button class="btn pri sm grow" onclick="approveShop('${a.id}')">Duyệt</button>`:''}</div></div>`).join('')||'<div class="empty" style="padding:16px">✓ Hết hàng đợi</div>'}</div>
   <div><div class="row between b sm">${ic('flag','sm')} Sản phẩm gắn cờ (${fls.length})<button class="link xs" onclick="go('a','moderation',{})">Tất cả</button></div>${fls.map(f=>{const x=P(f.pid);return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px">${miniP(x,esc(shopOf(x.shop).name))}<div class="xs mt4" style="color:var(--err)">${esc(f.reason)}</div><div class="row mt8"><button class="btn ghost sm grow" onclick="allowProduct('${f.id}')">Cho phép</button><button class="btn danger sm grow" onclick="takedownAsk('${f.id}')">Gỡ</button></div></div>`}).join('')||'<div class="empty" style="padding:16px">✓ Hết hàng đợi</div>'}</div>

AS.shops=p=>{const tab=p.tab||'queue';const list=S.applications.filter(a=>tab==='queue'?a.status==='cho_duyet':a.status!=='cho_duyet');const cur=S.applications.find(a=>a.id===p.id)||list[0];
  const L={cho_duyet:['Chờ duyệt','warn'],da_duyet:['Đã duyệt','fast'],bo_sung:['Yêu cầu bổ sung','auth'],tu_choi:['Từ chối','err']};
  const chk=(ok,t,w)=>`<div class="row sm" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="color:${ok?'var(--ok)':w?'var(--warn)':'var(--err)'}">${ic(ok?'check':w?'alert':'x','sm')}</span><span class="grow">${t}</span></div>`;
  return{title:'Duyệt shop & định danh',body:`${tabsBar('a','shops',[['queue','Chờ duyệt',S.applications.filter(a=>a.status==='cho_duyet').length],['done','Đã xử lý',S.applications.filter(a=>a.status!=='cho_duyet').length],['all','Tất cả shop',SHOPS.length]],tab)}
  <div style="border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px">${tab==='all'?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Shop</th><th>Chủ sở hữu</th><th>Loại hình</th><th>Định danh</th><th class="num">Điểm uy tín</th><th>Trạng thái</th></tr></thead><tbody>${SHOPS.map(s0=>{const s=shopOf(s0.id);return `<tr><td><div class="row"><div class="avatar">${logoHTML(s)}</div><b>${esc(s.name)}</b></div></td><td>${esc(s.owner)}</td><td>${s.type}</td><td>${s.verified?`<span class="bdg ver">${ic('shield','sm')}VNeID ${s.vdate}</span>`:'<span class="bdg warn">Chưa định danh</span>'}</td><td class="num">${s.score}</td><td><span class="bdg ${s.locked?'err':'fast'}">${s.locked?'Tạm khóa':'Hoạt động'}</span></td></tr>`}).join('')}</tbody></table></div>`
  :`<div class="grid" style="grid-template-columns:320px minmax(0,1fr)"><div class="card" style="padding:0;overflow:hidden">${list.map(a=>`<button class="listrow" style="${cur&&cur.id===a.id?'background:var(--brand-50)':''}" onclick="go('a','shops',{tab:'${tab}',id:'${a.id}'},true)"><div class="grow"><div class="row between"><b class="sm">${esc(a.name)}</b><span class="bdg ${L[a.status][1]}">${L[a.status][0]}</span></div><div class="xs muted">${a.id} · ${esc(a.owner)} · ${ago(a.submitted)}</div>${a.mine?'<span class="bdg acc mt4">Từ luồng demo người bán</span>':''}</div></button>`).join('')||'<div class="empty">Không có hồ sơ</div>'}</div>
  ${cur?`<div class="card"><div class="card-h"><div><h3>${esc(cur.name)}</h3><div class="xs muted">${cur.id} · nộp ${dt(cur.submitted)}</div></div>${riskBdg(cur.risk)}</div>
   <div class="grid g2"><div><div class="label">Thông tin đăng ký</div>${[['Người đại diện',cur.owner],['Loại hình',cur.type],['Mã số thuế',cur.mst],['Ngành hàng',cur.cat],['Khu vực',cur.city]].map(([a,b])=>`<div class="kv sm"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div>
   <div><div class="label">Kết quả kiểm tra tự động</div>${chk(cur.vneid.ok,'VNeID: '+cur.vneid.level)}${chk(cur.vneid.match,'Họ tên VNeID khớp tên đăng ký')}${chk(cur.mstOk,cur.mstOk?'MST hợp lệ, khớp tên người đại diện':'MST chưa tra cứu được / không khớp',!cur.mstOk&&cur.vneid.ok)}${chk(true,'Tài khoản ngân hàng trùng tên định danh')}${chk(cur.risk!=='Cao','Không nằm trong danh sách shop bị khóa',cur.risk==='Trung bình')}</div></div>
   ${cur.note?`<div class="alert info mt12">${ic('info','sm')}<div>Ghi chú: ${esc(cur.note)}</div></div>`:''}
   ${cur.status==='cho_duyet'?`<div class="row mt16" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn danger" onclick="decideShopAsk('${cur.id}','tu_choi')">Từ chối</button><button class="btn ghost" onclick="decideShopAsk('${cur.id}','bo_sung')">Yêu cầu bổ sung</button><button class="btn pri" ${cur.vneid.ok?'':'disabled title="Chưa định danh VNeID"'} onclick="approveShop('${cur.id}')">${ic('check','sm')} Duyệt & cấp huy hiệu định danh</button></div>${cur.vneid.ok?'':`<p class="xs mt8" style="color:var(--err);text-align:right">Không thể duyệt khi chưa định danh VNeID (Luật TMĐT 2025).</p>`}`:''}</div>`:''}</div>`}</div>`}};
function approveShop(id){const a=S.applications.find(x=>x.id===id);a.status='da_duyet';a.note='Đã duyệt bởi Phạm Quang Huy';
  if(a.shop){S.shopOver=S.shopOver||{};S.shopOver[a.shop]={...(S.shopOver[a.shop]||{}),verified:true,vdate:new Date().toLocaleDateString('vi-VN')}}
  if(a.mine){S.s.onboard.status='da_duyet';notify('s',`Shop <b>${esc(a.name)}</b> đã được duyệt định danh. Bắt đầu đăng sản phẩm!`,['register',{}])}
  toast('Đã duyệt '+a.name+', huy hiệu “Đã định danh” hiển thị ngay','shield');aDone('shop');refresh('a')}

   return `<div class="card"><div class="grid" style="grid-template-columns:minmax(0,1fr) ${priceFlag?'340px':'0'};gap:16px"><div><div class="row between">${miniP(x,esc(shopOf(x.shop).name)+(shopOf(x.shop).verified?'':' · chưa định danh'))}<span class="bdg ${f.sev==='Cao'?'err':f.sev==='Trung bình'?'warn':'gray'}">Mức ${f.sev.toLowerCase()}</span></div>
    <div class="alert err mt12">${ic('flag','sm')}<div><b>${esc(f.reason)}</b><div class="xs">Nguồn: ${esc(f.src)} · ${ago(f.created)}</div></div></div>
    <div class="row sm mt8 muted">Giá ${fmt(x.price)}${x.orig?' · “giá gốc” '+fmt(x.orig):''} · đã bán ${x.sold} · ${x.status==='cho_duyet'?'đang chờ duyệt, chưa hiển thị':'đang hiển thị với người mua'}</div>
    ${f.status==='cho_xu_ly'?`<div class="row mt12"><button class="btn ghost sm" onclick="go('b','product',{id:'${x.id}'})">${ic('eye','sm')} Xem như người mua</button><span class="grow"></span><button class="btn ghost sm" onclick="allowProduct('${f.id}')">Cho phép</button><button class="btn danger sm" onclick="takedownAsk('${f.id}')">Gỡ sản phẩm</button></div>`:`<div class="mt8"><span class="bdg ${f.status==='da_go'?'err':'fast'}">${f.status==='da_go'?'Đã gỡ':'Đã cho phép'}</span> <span class="xs muted">${esc(f.note||'')}</span></div>`}</div>
    ${priceFlag?`<div><div class="label">Lịch sử giá 30 ngày</div><div class="chart-wrap">${priceChart(x)}</div><div class="xs muted">Tăng ${st.hike}% so với mức thường ngày ${fmt(st.early)}</div></div>`:'<div></div>'}</div></div>`}).join('')||'<div class="empty"><div class="art"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>Không có sản phẩm nào</div>'}</div>`}};
function allowProduct(fid){const f=S.flagged.find(x=>x.id===fid);f.status='cho_phep';f.note='Kiểm tra thủ công: không vi phạm';const x=P(f.pid);if(x.status==='cho_duyet')x.status='dang_ban';if(x.shop===S.s.shop)notify('s',`Sản phẩm <b>${esc(x.name)}</b> đã được duyệt và hiển thị.`,['products',{}]);toast('Đã cho phép sản phẩm');refresh('a')}
function takedownAsk(fid){const f=S.flagged.find(x=>x.id===fid);openModal(mHead('Gỡ sản phẩm')+`<div class="modal-b">${miniP(P(f.pid))}<label class="label mt12">Lý do gửi người bán</label><select class="select" id="tdr"><option>${esc(f.reason)}</option><option>Hàng giả, hàng nhái, vi phạm sở hữu trí tuệ</option><option>Giảm giá ảo, tăng giá trước khi khuyến mãi</option><option>Hình ảnh sao chép từ shop khác</option></select><div class="row mt12"><button class="check" id="tdw" onclick="this.classList.toggle('on')"></button><span class="sm">Trừ 5 điểm uy tín của shop</span></div></div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Hủy</button><button class="btn danger" onclick="takedown('${fid}',$('#tdr').value,$('#tdw').classList.contains('on'))">Gỡ & thông báo người bán</button></div>`)}
function takedown(fid,reason,pen){const f=S.flagged.find(x=>x.id===fid);f.status='da_go';f.note=reason;const x=P(f.pid);x.status='bi_go';x.modNote=reason;
  if(x.shop===S.s.shop){notify('s',`Sản phẩm <b>${esc(x.name)}</b> bị gỡ: ${esc(reason)}`,['products',{tab:'vp'}]);if(pen)S.s.reputation-=5}
  S.b.cart=S.b.cart.filter(c=>c.pid!==x.id);closeModal();toast('Đã gỡ sản phẩm và gửi lý do cho người bán','flag');refresh('a')}

/* ---- Đơn hàng & tranh chấp ---- */
AS.orders=p=>{const tab=p.tab||'all';const q=p.q||'';const list=S.orders.filter(o=>(tab==='all'||(tab==='dispute'?S.complaints.some(k=>k.order===o.id):o.status===tab))&&(!q||o.id.includes(q.toUpperCase())));

function aOrderModal(id){const o=S.orders.find(x=>x.id===id);openModal(mHead('Đơn '+id)+`<div class="modal-b"><div class="row between">${pill(o.status)}<span class="sm">${esc(o.buyer.name)} → ${esc(shopOf(o.shop).name)}</span></div><div class="mt12">${o.items.map(i=>`<div class="row between" style="padding:6px 0">${miniP(P(i.pid),i.variant+' x'+i.qty)}<b>${fmt(i.price*i.qty)}</b></div>`).join('')}</div><div class="divider"></div><div class="grid g2"><div><div class="kv sm"><span>Khách trả</span><b>${fmt(total(o))}</b></div><div class="kv sm"><span>Người bán thực nhận</span><b>${fmt(orderNet(o).net)}</b></div><div class="kv sm"><span>Doanh thu phí sàn</span><b>${fmt(orderNet(o).fee)}</b></div><div class="kv sm"><span>Sàn tài trợ (voucher/ship/xu)</span><b>${fmt(o.vPlat+o.shipDisc+o.xu)}</b></div></div><div><div class="label">Lịch sử</div><div class="tl">${o.log.map(l=>`<div>${esc(l.text)}<div class="xs faint">${dt(l.t)}</div></div>`).join('')}</div></div></div></div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Đóng</button></div>`,true)}

/* ---- Khiếu nại & hoàn tiền ---- */
AS.complaints=p=>{const tab=p.tab||'open';const list=S.complaints.filter(k=>tab==='open'?['cho_shop','cho_san'].includes(k.status):!['cho_shop','cho_san'].includes(k.status));const cur=S.complaints.find(k=>k.id===p.id)||list[0];
  const L={cho_shop:['Chờ shop phản hồi','warn'],cho_san:['Cần Sàn phân xử','err'],da_hoan:['Đã hoàn tiền','gray'],tu_choi:['Từ chối, giải ngân shop','fast']};
  return{title:'Khiếu nại & hoàn tiền',body:`${tabsBar('a','complaints',[['open','Đang mở',S.complaints.filter(k=>['cho_shop','cho_san'].includes(k.status)).length],['done','Đã đóng',S.complaints.filter(k=>!['cho_shop','cho_san'].includes(k.status)).length]],tab)}
  <div style="border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px"><div class="grid" style="grid-template-columns:300px minmax(0,1fr)"><div class="card" style="padding:0;overflow:hidden">${list.map(k=>`<button class="listrow" style="${cur&&cur.id===k.id?'background:var(--brand-50)':''}" onclick="go('a','complaints',{tab:'${tab}',id:'${k.id}'},true)"><div class="grow"><div class="row between"><b class="sm">${k.id}</b><span class="bdg ${L[k.status][1]}">${L[k.status][0]}</span></div><div class="xs muted">${esc(k.buyer)} ↔ ${esc(shopOf(k.shop).name)}</div><div class="xs">${esc(k.reason)} · ${fmt(k.amount)}</div></div></button>`).join('')||'<div class="empty">Không có khiếu nại</div>'}</div>
  ${cur?(()=>{const o=S.orders.find(x=>x.id===cur.order);const x=P(o.items[0].pid);const sh=shopOf(cur.shop);return `<div class="card"><div class="card-h"><div><h3>${cur.id} · Đơn ${cur.order}</h3><div class="xs muted">Mở ${dt(cur.created)} · ${esc(cur.buyer)} ↔ ${esc(sh.name)} ${sh.verified?'(đã định danh)':'(<b style="color:var(--warn)">chưa định danh</b>)'}</div></div><span class="bdg ${L[cur.status][1]}">${L[cur.status][0]}</span></div>
   <div class="grid g2"><div class="card" style="background:var(--surface-2)"><div class="label">Người mua trình bày</div><div class="b sm">${esc(cur.reason)}</div><p class="sm mt4">“${esc(cur.desc)}”</p><div class="thumbs">${Array(cur.photos).fill(0).map((_,i)=>`<div style="width:64px">${pimg({...x,_k:i+1},{e:24})}</div>`).join('')}</div></div>
   <div class="card" style="background:var(--surface-2)"><div class="label">Người bán phản hồi</div>${cur.sellerResp?`<p class="sm">“${esc(cur.sellerResp)}”</p><div class="xs muted mt4 row gap4">${ic('file','sm')} video_dong_goi.mp4</div>`:`<p class="sm muted">Chưa phản hồi (hạn còn ${Math.max(0,48-Math.floor((Date.now()-cur.created)/3600e3))}h)</p>`}</div></div>
   <div class="grid g2 mt12"><div>${miniP(x,o.items[0].variant+' x'+o.items[0].qty)}<div class="kv sm mt8"><span>Tiền Sàn đang giữ</span><b class="price">${fmt(total(o))}</b></div><div class="kv sm"><span>Lịch sử khiếu nại của người mua</span><b>0 lần / 12 tháng</b></div><div class="kv sm"><span>Tỉ lệ khiếu nại của shop</span><b>${sh.verified?'1,2%':'8,7%'}</b></div></div><div><div class="label">Tiến trình</div><div class="tl">${[...cur.log].reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div></div></div>
   ${['cho_shop','cho_san'].includes(cur.status)?`<div class="divider"></div><div class="label">Quyết định của Sàn</div>${cur.status==='cho_shop'?`<div class="alert warn" style="margin-bottom:10px">${ic('info','sm')}<div>Shop chưa phản hồi. Sàn có thể xử lý thay khi quá hạn 48h hoặc bằng chứng rõ ràng.</div></div>`:''}
    <div class="row wrap"><button class="btn pri" onclick="aRefund('${cur.id}',${cur.amount})">Hoàn tiền toàn phần ${fmt(cur.amount)}</button><div class="row"><input class="input" id="partial" style="width:140px;min-height:44px" placeholder="Số tiền" value="${Math.round(cur.amount/2/1000)*1000}"><button class="btn ghost" onclick="aRefund('${cur.id}',+$('#partial').value)">Hoàn một phần</button></div><button class="btn danger" onclick="aReject('${cur.id}')">Từ chối, giải ngân cho shop</button></div>
    <textarea class="textarea mt8" id="knnote" placeholder="Ghi chú gửi cả hai bên (bắt buộc khi từ chối)"></textarea>`:`<div class="alert ${cur.status==='da_hoan'?'ok':'info'} mt12">${ic('check','sm')}<div>${cur.status==='da_hoan'?'Đã hoàn '+fmt(cur.refund||cur.amount)+' cho người mua.':'Đã từ chối: '+esc(cur.note||'')}</div></div>`}</div>`})():''}</div></div>`}};
function aRefund(id,amt){const k=S.complaints.find(x=>x.id===id);if(!amt||amt<=0||amt>k.amount){toast('Số tiền không hợp lệ','alert');return}const note=$('#knnote')&&$('#knnote').value;
  refundOrder(k,amt,'Sàn quyết định');if(note)k.log.push('Ghi chú: '+note);if(k.shop===S.s.shop)notify('s',`Sàn đã quyết định hoàn ${fmt(amt)} cho khiếu nại <b>${k.id}</b>.`,['returns',{id}]);
  if(amt<k.amount){const o=S.orders.find(x=>x.id===k.order);addLog(o,`Phần còn lại ${fmt(k.amount-amt)} giải ngân cho người bán.`)}
  toast('Đã hoàn tiền, hai bên được thông báo','scale');aDone('kn');refresh('a')}
function aReject(id){const note=($('#knnote').value||'').trim();if(!note){toast('Nhập ghi chú lý do từ chối','alert');return}const k=S.complaints.find(x=>x.id===id);k.status='tu_choi';k.note=note;k.log.push('Sàn từ chối yêu cầu, '+note);
  const o=S.orders.find(x=>x.id===k.order);o.status='hoan_thanh';addLog(o,'Sàn từ chối yêu cầu trả hàng. Giải ngân cho người bán.');
  if(o.buyerId==='u1')notify('b',`Yêu cầu <b>${k.id}</b> không được chấp nhận: ${esc(note)}`,['orderDetail',{id:o.id}]);if(k.shop===S.s.shop)notify('s',`Khiếu nại <b>${k.id}</b> được giải quyết có lợi cho shop. Đã giải ngân.`,['finance',{}]);
  toast('Đã từ chối & giải ngân cho shop');aDone('kn');refresh('a')}

/* ---- Chiến dịch, Flash Sale, banner ---- */

  let body;
  if(tab==='banner')body=`<div class="grid g-main"><div class="card"><div class="card-h"><h3>Banner trang chủ di động</h3><span class="bdg warn">Tối đa 1 banner · không pop-up</span></div>
   <div class="field"><label class="label">Tiêu đề</label><input class="input" id="bn-t" value="${esc(S.banner.title)}" oninput="$('#bnp h3').textContent=this.value"></div><div class="field"><label class="label">Mô tả</label><input class="input" id="bn-s" value="${esc(S.banner.sub)}" oninput="$('#bnp p').textContent=this.value"></div><div class="field"><label class="label">Nút kêu gọi</label><input class="input" id="bn-c" value="${esc(S.banner.cta)}" oninput="$('#bnp .btn').textContent=this.value"></div><div class="field"><label class="label">Liên kết đến</label><select class="select"><option>Trang sự kiện Flash Sale / 10.10</option></select></div>

  return{title:'Chiến dịch, Flash Sale, banner',actions:`<button class="btn pri sm" onclick="newCampaignModal()">${ic('plus','sm')} Tạo chiến dịch</button>`,body:tabsBar('a','campaigns',[['camp','Chiến dịch & Flash Sale',S.campaigns.length],['banner','Banner trang chủ']],tab)+`<div style="border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px">${body}</div>`}};
function newCampaignModal(){openModal(mHead('Tạo chiến dịch mới')+`<div class="modal-b"><div class="field"><label class="label">Tên chiến dịch</label><input class="input" id="nc-n" value="11.11 Siêu sale minh bạch"></div><div class="grid g3"><div class="field"><label class="label">Loại</label><select class="select" id="nc-t"><option>Ngày đôi</option><option>Flash Sale</option><option>Ngành hàng</option></select></div><div class="field"><label class="label">Ngày diễn ra</label><input class="input" id="nc-d" value="11/11/2026"></div><div class="field"><label class="label">Hạn đăng ký</label><input class="input" id="nc-dl" value="06/11/2026"></div></div>
 <div class="grid g2"><div class="field"><label class="label">Giảm tối thiểu (% so với giá thấp nhất 30 ngày)</label><input class="input" id="nc-m" value="15"></div><div class="field"><label class="label">Khung giờ</label><input class="input" id="nc-s" value="00:00, 12:00, 20:00"></div></div><div class="alert info">${ic('info','sm')}<div>Người bán nhận thông báo và đăng ký ở mục Voucher & Flash Sale → Chương trình của sàn. Người mua thấy khung giờ mới ở trang sự kiện.</div></div></div>
 <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="createCampaign()">Tạo & mở đăng ký</button></div>`)}
function createCampaign(){const c={id:'C-'+Date.now().toString().slice(-4),name:$('#nc-n').value,type:$('#nc-t').value,start:$('#nc-d').value,end:$('#nc-d').value,deadline:$('#nc-dl').value,minDisc:+$('#nc-m').value||10,status:'Đang mở đăng ký',slots:$('#nc-s').value.split(',').map(s=>s.trim()).filter(Boolean),regs:[]};
  S.campaigns.push(c);notify('s',`Sàn mở đăng ký chương trình <b>${esc(c.name)}</b>, hạn ${c.deadline}`,['marketing',{tab:'camp'}],'promo');closeModal();toast('Đã tạo chiến dịch & thông báo người bán','mega');go('a','campaigns',{tab:'camp',id:c.id},true)}

/* ---- Danh mục ngành hàng ---- */
AS.categories=()=>{S.catReq=S.catReq||{mp:1,mb:1,dt:1};return{title:'Danh mục ngành hàng',body:`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngành hàng</th><th>Danh mục con</th><th class="num">Sản phẩm</th><th class="num">Phí cố định</th><th>Bắt buộc giấy tờ chính hãng</th><th></th></tr></thead><tbody>
 ${CATS.map(c=>`<tr><td><div class="row"><span class="catdot sm">${imgTag(CATIMG[c.id],80)}</span><b>${c.name}</b></div></td><td><div class="chips" style="flex-wrap:wrap;max-width:420px">${c.subs.map(s=>`<span class="bdg gray">${s}</span>`).join('')}</div></td><td class="num">${S.products.filter(p=>p.cat===c.id).length}</td><td class="num"><button class="link" onclick="go('a','fees',{})">${S.fees.cats[c.id]}%</button></td><td><button class="toggle ${S.catReq[c.id]?'on':''}" onclick="S.catReq['${c.id}']=!S.catReq['${c.id}'];refresh('a')"></button></td><td><button class="btn ghost sm" onclick="const v=prompt('Tên danh mục con mới cho ${c.name}');if(v){CATS.find(x=>x.id==='${c.id}').subs.push(v);toast('Đã thêm danh mục con');refresh('a')}">${ic('plus','sm')} Thêm con</button></td></tr>`).join('')}</tbody></table></div>
 <p class="xs muted mt8">Ngành hàng bật “bắt buộc giấy tờ chính hãng” yêu cầu người bán tải hóa đơn/giấy ủy quyền trước khi gắn nhãn Chính hãng.</p>`}};

/* ---- Người dùng & phân quyền ---- */
AS.users=p=>{const tab=p.tab||'staff';const mods=['Dashboard','Duyệt shop','Duyệt SP','Đơn hàng','Khiếu nại','Chiến dịch','Cấu hình phí'];let body;
  if(tab==='buyers')body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Người mua</th><th>SĐT</th><th class="num">Đơn</th><th class="num">Khiếu nại</th><th>Trạng thái</th></tr></thead><tbody>${[['Huỳnh Thị Lan','0901 234 567',myOrders().length,S.complaints.filter(k=>k.buyer==='Huỳnh Thị Lan').length],['Trần Minh','0912 *** 881',14,0],['Phạm Thu','0938 *** 420',9,0],['Ngô Bảo','0965 *** 739',6,1],['Bùi Hạnh','0945 *** 027',3,1],['Lê Quang','0977 *** 135',22,0]].map(r=>`<tr><td><div class="row"><div class="avatar">${initials(r[0])}</div>${r[0]}</div></td><td>${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td><span class="bdg fast">Hoạt động</span></td></tr>`).join('')}</tbody></table></div>`;
  else if(tab==='sellers')body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Shop</th><th>Định danh</th><th class="num">Uy tín</th><th>Trạng thái</th><th></th></tr></thead><tbody>${SHOPS.map(s0=>{const s=shopOf(s0.id);return `<tr><td>${logoHTML(s,'sm')} <b>${esc(s.name)}</b></td><td>${s.verified?'<span class="bdg ver">Đã định danh</span>':'<span class="bdg warn">Chưa</span>'}</td><td class="num">${s.id===S.s.shop?S.s.reputation:s.score}</td><td><span class="bdg ${s.locked?'err':'fast'}">${s.locked?'Tạm khóa':'Hoạt động'}</span></td><td><button class="btn ghost sm" onclick="S.shopOver=S.shopOver||{};S.shopOver['${s.id}']={...(S.shopOver['${s.id}']||{}),locked:!${!!s.locked}};toast('${s.locked?'Đã mở khóa':'Đã tạm khóa'} shop');refresh('a')">${s.locked?'Mở khóa':'Tạm khóa'}</button></td></tr>`}).join('')}</tbody></table></div>`;
  else body=`<div class="grid g-main"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nhân sự</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th></tr></thead><tbody>${S.staff.map((u,i)=>`<tr><td><div class="row"><div class="avatar">${initials(u.name)}</div>${u.name}</div></td><td>${u.email}</td><td><select class="select" style="min-height:34px" onchange="S.staff[${i}].role=this.value;toast('Đã đổi vai trò');save()">${Object.keys(S.perms).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><button class="toggle ${u.on?'on':''}" onclick="S.staff[${i}].on=!S.staff[${i}].on;refresh('a')"></button></td></tr>`).join('')}</tbody></table></div>
   <div class="card"><div class="card-h"><h3>Thêm nhân sự</h3></div><input class="input" id="st-n" placeholder="Họ tên"><input class="input mt8" id="st-e" placeholder="Email @ro.vn"><select class="select mt8" id="st-r">${Object.keys(S.perms).map(r=>`<option>${r}</option>`).join('')}</select><button class="btn pri block mt12" onclick="if(!$('#st-n').value)return;S.staff.push({name:$('#st-n').value,email:$('#st-e').value,role:$('#st-r').value,on:true});toast('Đã mời nhân sự');refresh('a')">Gửi lời mời</button></div></div>
   <div class="card mt16"><div class="card-h"><h3>Ma trận phân quyền</h3></div><div class="tbl-wrap" style="border:0"><table class="tbl perm"><thead><tr><th>Vai trò</th>${mods.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${Object.entries(S.perms).map(([r,a])=>`<tr><td><b>${r}</b></td>${a.map((v,j)=>`<td><button class="check ${v?'on':''}" style="margin:auto" ${r==='Super admin'?'disabled':''} onclick="S.perms['${r}'][${j}]=${v?0:1};refresh('a')">${v?ic('check','sm'):''}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return{title:'Người dùng & phân quyền',body:tabsBar('a','users',[['staff','Nội bộ & phân quyền'],['sellers','Người bán'],['buyers','Người mua']],tab)+`<div style="border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px">${body}</div>`}};

/* ---- Cấu hình phí sàn ---- */
AS.fees=()=>{const f=S.fees;const ex=feeCalc(1000000,'dgd',{freeship:true});
  return{title:'Cấu hình phí sàn',actions:`<button class="btn pri sm" onclick="saveFees()">Lưu & thông báo người bán</button>`,body:`<div class="grid g-main"><div class="col gap16"><div class="card"><div class="card-h"><h3>Phí cố định theo ngành hàng (% giá bán)</h3></div><div class="grid g2">${CATS.map(c=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${c.name}</span><div class="row gap4"><input class="input" style="width:80px;min-height:36px;text-align:right" id="fc-${c.id}" value="${f.cats[c.id]}">%</div></div>`).join('')}</div></div>
  <div class="card"><div class="card-h"><h3>Phí khác</h3></div><div class="grid g2"><div class="field"><label class="label">Phí thanh toán (%)</label><input class="input" id="f-pay" value="${f.pay}"></div><div class="field"><label class="label">Thuế khấu trừ hộ KD (%)</label><input class="input" id="f-tax" value="${f.tax}"></div><div class="field"><label class="label">Phí chương trình Freeship (%)</label><input class="input" id="f-fs" value="${f.freeship}"></div><div class="field"><label class="label">Trần phí Freeship / đơn (đ)</label><input class="input" id="f-cap" value="${f.freeshipCap}"></div></div></div></div>
  <div class="col gap16"><div class="card"><div class="card-h"><h3>Ví dụ hiển thị cho người bán</h3></div><p class="xs muted">Sản phẩm 1.000.000đ · Điện gia dụng · có Freeship</p><div class="fee-row"><span>Phí cố định</span><span>${fmt(ex.fixed)}</span></div><div class="fee-row"><span>Phí thanh toán</span><span>${fmt(ex.pay)}</span></div><div class="fee-row"><span>Freeship</span><span>${fmt(ex.fs)}</span></div><div class="fee-row"><span>Thuế</span><span>${fmt(ex.tax)}</span></div><div class="fee-row"><b>Người bán nhận</b><b style="color:var(--brand)">${fmt(ex.net)}</b></div></div>
  <div class="card"><div class="card-h"><h3>Nguyên tắc minh bạch</h3></div><ul class="sm" style="padding-left:18px;margin:0;line-height:1.8"><li>Thay đổi phí phải báo người bán trước 15 ngày</li><li>Biểu phí hiển thị ngay khi đăng sản phẩm</li><li>Không có phí ẩn, phí ngoài biểu</li></ul></div>
  <div class="card"><div class="card-h"><h3>Lịch sử thay đổi</h3></div><div class="tl">${f.history.map(h=>`<div>${esc(h.t)}<div class="xs faint">${h.d}</div></div>`).join('')}</div></div></div></div>`}};
function saveFees(){const f=S.fees;const changes=[];CATS.forEach(c=>{const v=+$('#fc-'+c.id).value;if(v!==f.cats[c.id]){changes.push(`${c.name} ${f.cats[c.id]}% → ${v}%`);f.cats[c.id]=v}});
  [['pay','f-pay','Phí thanh toán'],['tax','f-tax','Thuế'],['freeship','f-fs','Freeship'],['freeshipCap','f-cap','Trần Freeship']].forEach(([k,id,l])=>{const v=+$('#'+id).value;if(v!==f[k]){changes.push(`${l} ${f[k]} → ${v}`);f[k]=v}});
  if(!changes.length){toast('Không có thay đổi','info');return}const d=new Date().toLocaleDateString('vi-VN');f.updated=d;f.history.unshift({d,t:changes.join('; ')});
  notify('s',`Biểu phí cập nhật: ${esc(changes.join('; '))}. Bảng phí khi đăng sản phẩm đã dùng số mới.`,['editProduct',{}]);toast('Đã lưu, bảng phí bên Kênh người bán cập nhật ngay');refresh('a')}

/* ---- Báo cáo ---- */
AS.reports=()=>{const byCat=CATS.map(c=>S.products.filter(p=>p.cat===c.id).reduce((a,p)=>a+p.sold*p.price,0)/30);const st=Object.keys(STATUS).map(k=>S.orders.filter(o=>o.status===k).length);
  const shops=SHOPS.map(s=>({s:shopOf(s.id),g:S.products.filter(p=>p.shop===s.id).reduce((a,p)=>a+p.sold*p.price,0)})).sort((a,b)=>b.g-a.g);
  return{title:'Báo cáo',actions:`<button class="btn ghost sm" onclick="toast('Đã xuất báo cáo tháng 10 (mô phỏng)','download')">${ic('download','sm')} Xuất báo cáo</button>`,body:`<div class="grid g4">${kpi('GMV 30 ngày','34,8 tỷđ','▲ 21%','up')}${kpi('Tỉ lệ hủy','2,1%','▼ 0,4 điểm','up')}${kpi('Tỉ lệ trả hàng','1,4%','Ổn định')}${kpi('Doanh thu phí sàn','3,2 tỷđ','9,2% GMV')}</div>
  <div class="grid g2 mt16"><div class="card"><div class="card-h"><h3>GMV ước tính theo ngành / ngày</h3></div>${barChart(byCat,CATS.map(c=>c.short),{h:220})}</div><div class="card"><div class="card-h"><h3>Đơn theo trạng thái (dữ liệu demo)</h3></div>${barChart(st,Object.values(STATUS).map(s=>s.split(' ')[0]),{h:220,color:'var(--info)',fmtv:v=>Math.round(v)})}</div></div>
  <div class="card mt16"><div class="card-h"><h3>Top shop theo GMV</h3></div><table class="tbl"><thead><tr><th>#</th><th>Shop</th><th>Định danh</th><th class="num">GMV lũy kế</th><th class="num">Đánh giá</th></tr></thead><tbody>${shops.slice(0,8).map((r,i)=>`<tr><td>${i+1}</td><td>${logoHTML(r.s,'sm')} ${esc(r.s.name)}</td><td>${r.s.verified?'<span class="bdg ver">Đã định danh</span>':'<span class="bdg warn">Chưa</span>'}</td><td class="num">${fmtK(r.g)}đ</td><td class="num">★ ${r.s.rating}</td></tr>`).join('')}</tbody></table></div>`}};

/* ---- Quy chế & chính sách ---- */
AS.policies=p=>{const cur=S.policies.find(x=>x.id===p.id)||S.policies[0];
  return{title:'Quy chế & chính sách',body:`<div class="alert info" style="margin-bottom:16px">${ic('info','sm')}<div>Luật TMĐT số 122/2025/QH15 (hiệu lực 01/07/2026): sàn có livestream phải công khai quy chế livestream và chỉ vận hành sau khi Bộ Công Thương xác nhận đăng ký.</div></div>
  <div class="grid" style="grid-template-columns:340px minmax(0,1fr)"><div class="card" style="padding:0;overflow:hidden">${S.policies.map(x=>`<button class="listrow" style="${cur.id===x.id?'background:var(--brand-50)':''}" onclick="go('a','policies',{id:'${x.id}'},true)">${ic('file')}<div class="grow"><div class="sm b">${x.name}</div><div class="xs muted">${x.ver} · ${x.date}</div><span class="bdg ${/chờ/i.test(x.status)?'warn':'fast'} mt4">${x.status}</span></div></button>`).join('')}</div>
  <div class="card"><div class="card-h"><div><h3>${cur.name}</h3><div class="xs muted">${cur.ver} · hiệu lực ${cur.date}</div></div><div class="row">${/chờ/i.test(cur.status)?`<button class="btn sim sm" onclick="S.policies.find(x=>x.id==='${cur.id}').status='Bộ Công Thương đã xác nhận';notify('a','Bộ Công Thương đã xác nhận quy chế livestream',['policies',{id:'live'}]);toast('Mô phỏng: đã được xác nhận');refresh('a')">Mô phỏng: BCT xác nhận</button>`:''}<button class="btn ghost sm" onclick="toast('Đã mở bản nháp phiên bản mới','edit')">${ic('edit','sm')} Soạn phiên bản mới</button><button class="btn ghost sm" onclick="go('b','policy',{id:'${cur.id}'})">Xem phía người mua</button></div></div><div class="legal">${POLICY_TEXT[cur.id]}</div></div></div>`}};

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.modal)closeModal();else if(UI.sheet)closeSheet();else if(UI.notifOpen){UI.notifOpen=null;refreshAll()}}});
mount();
</script></body></html>
