<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rõ — Prototype Sàn TMĐT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --brand:#0B7A63;--brand-600:#08624F;--brand-50:#E8F5F1;--brand-100:#CBE9DF;--on-brand:#fff;
  --accent:#D3243B;--accent-50:#FDECEE;
  --ok:#15803D;--ok-50:#E7F5EC;--warn:#A85407;--warn-50:#FDF2E2;--err:#D32222;--err-50:#FDECEC;--info:#1D5FC2;--info-50:#E8F0FC;
  --g1:#F7F8F8;--g2:#EEF1F0;--g3:#DDE2E1;--g4:#BAC2C0;--g5:#8B9593;--g6:#5A6563;--g7:#2E3837;--g8:#141B1A;
  --bg:#ECEFEE;--surface:#fff;--surface-2:#F6F8F7;--line:#E2E7E5;--text:#141B1A;--text-2:#56625F;--text-3:#86918E;
  --r:8px;--r-lg:12px;--shadow:0 1px 2px rgba(10,30,25,.06),0 6px 20px rgba(10,30,25,.07);
  --fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:22px;--fs-2xl:28px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#38C29E;--brand-600:#5BD3B2;--brand-50:#11302A;--brand-100:#1A463C;--on-brand:#06221B;
  --accent:#FF6077;--accent-50:#3A1820;--ok:#4ADE80;--ok-50:#12301E;--warn:#F5B04C;--warn-50:#35260F;--err:#FF6B6B;--err-50:#3A1717;--info:#7DB0FF;--info-50:#15253E;
  --g1:#1B2322;--g2:#222B2A;--g3:#2E3937;--g4:#475451;--g5:#6E7C79;--g6:#9AA7A4;--g7:#CBD5D2;--g8:#EEF3F1;
  --bg:#0B1110;--surface:#141B1A;--surface-2:#1A2221;--line:#28322F;--text:#E8EEEC;--text-2:#A3AFAC;--text-3:#76827F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#38C29E;--brand-600:#5BD3B2;--brand-50:#11302A;--brand-100:#1A463C;--on-brand:#06221B;
  --accent:#FF6077;--accent-50:#3A1820;--ok:#4ADE80;--ok-50:#12301E;--warn:#F5B04C;--warn-50:#35260F;--err:#FF6B6B;--err-50:#3A1717;--info:#7DB0FF;--info-50:#15253E;
  --g1:#1B2322;--g2:#222B2A;--g3:#2E3937;--g4:#475451;--g5:#6E7C79;--g6:#9AA7A4;--g7:#CBD5D2;--g8:#EEF3F1;
  --bg:#0B1110;--surface:#141B1A;--surface-2:#1A2221;--line:#28322F;--text:#E8EEEC;--text-2:#A3AFAC;--text-3:#76827F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-sm);line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.xs{font-size:var(--fs-xs)}.sm{font-size:var(--fs-sm)}.md{font-size:var(--fs-md)}.lg{font-size:var(--fs-lg)}.xl{font-size:var(--fs-xl)}.xxl{font-size:var(--fs-2xl)}
.b{font-weight:600}.bb{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap12{gap:12px}.gap16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.p12{padding:12px}.p16{padding:16px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:var(--accent);font-weight:700}
.strike{text-decoration:line-through;color:var(--text-3);font-size:var(--fs-xs)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--brand);display:flex;align-items:baseline;gap:2px}
.logo i{font-style:normal;color:var(--accent)}
.proto-tag{font-size:12px;color:var(--text-2);border-left:1px solid var(--line);padding-left:12px;line-height:1.3}
.seg{display:flex;background:var(--g2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-weight:500;color:var(--text-2);white-space:nowrap;min-height:36px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tb-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;min-height:38px;white-space:nowrap}
.tbtn:hover{background:var(--g1)}
.timer-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--warn-50);color:var(--warn);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{padding:20px;display:flex;gap:24px;justify-content:center;align-items:flex-start;min-height:calc(100vh - 60px)}
.stage.desk-only{padding:0;display:block}
.stage.split .desk-wrap{flex:1;min-width:0;height:844px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.stage.split .desk-wrap .desk{height:100%}
.side-notes{width:340px;flex:none;display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.screen-list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:6px;min-height:34px}
.screen-list button:hover{background:var(--g1)}
.screen-list button.on{background:var(--brand-50);color:var(--brand);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--g4);flex:none}
.dot.core{background:var(--info);border-color:var(--info)}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;flex:none;border-radius:44px;background:var(--g8);padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
:root[data-theme="dark"] .phone{background:#000}
.phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.statusbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;font-size:13px;font-weight:600;background:var(--surface)}
.statusbar.dark{background:#000;color:#fff}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#000;border-radius:20px;z-index:5}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.bnav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 18px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-3);min-height:44px;position:relative}
.bnav button.on{color:var(--brand);font-weight:600}
.bnav .cnt{position:absolute;top:-2px;left:calc(50% + 4px);background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
.sticky-bot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px 22px;display:flex;gap:8px;align-items:center}
.apphead{position:sticky;top:0;z-index:4;background:var(--surface);display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:52px;border-bottom:1px solid var(--line)}
.apphead h2{font-size:var(--fs-md);font-weight:600;flex:1;min-width:0}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:99px;flex:none;position:relative}
.iconbtn:hover{background:var(--g2)}
.iconbtn .cnt{position:absolute;top:2px;right:0;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;line-height:16px}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--g2);border-radius:99px;padding:0 14px;height:40px;color:var(--text-3);min-width:0}
.searchbox input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.section{background:var(--surface);margin-top:8px;padding:14px 12px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-h h3{font-size:var(--fs-md);font-weight:700}
.link{color:var(--brand);font-weight:500;font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:2px}

/* product */
.pimg{position:relative;aspect-ratio:1;border-radius:var(--r);display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 30% 25%,hsl(var(--h) 70% 92%),hsl(var(--h) 45% 80%));}
:root[data-theme="dark"] .pimg{background:radial-gradient(circle at 30% 25%,hsl(var(--h) 30% 30%),hsl(var(--h) 30% 18%))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pimg{background:radial-gradient(circle at 30% 25%,hsl(var(--h) 30% 30%),hsl(var(--h) 30% 18%))}}
.pimg span{font-size:var(--e,44px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.pimg .vid{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:2px 7px;font-size:10px;display:flex;gap:3px;align-items:center}
.pimg .disc{position:absolute;right:0;top:0;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-bottom-left-radius:6px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{background:var(--surface);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--line);text-align:left}
.pcard .pimg{border-radius:0}
.pcard .body{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .name{font-size:13px;line-height:1.35;min-height:35px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;line-height:16px;white-space:nowrap}
.bdg.ver{background:var(--brand-50);color:var(--brand)}
.bdg.auth{background:var(--info-50);color:var(--info)}
.bdg.fast{background:var(--ok-50);color:var(--ok)}
.bdg.warn{background:var(--warn-50);color:var(--warn)}
.bdg.err{background:var(--err-50);color:var(--err)}
.bdg.gray{background:var(--g2);color:var(--text-2)}
.bdg.acc{background:var(--accent-50);color:var(--accent)}
.stars{color:#E9A23B;letter-spacing:-1px;font-size:12px}
.meta{font-size:11.5px;color:var(--text-3);display:flex;justify-content:space-between;gap:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.pri{background:var(--brand);color:var(--on-brand)}.btn.pri:hover{background:var(--brand-600)}
.btn.acc{background:var(--accent);color:#fff}
.btn.sec{background:var(--brand-50);color:var(--brand);border-color:var(--brand-100)}
.btn.ghost{border-color:var(--line);background:var(--surface)}.btn.ghost:hover{background:var(--g1)}
.btn.danger{background:var(--err-50);color:var(--err);border-color:transparent}
.btn.sim{border:1.5px dashed var(--warn);color:var(--warn);background:var(--warn-50)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 12px;min-height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;flex:none}
.chip.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 14px;white-space:nowrap;color:var(--text-2);border-bottom:2px solid transparent;font-weight:500;min-height:44px;flex:none}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.tabs .n{font-size:11px;background:var(--g2);border-radius:99px;padding:0 6px;margin-left:4px}
.tabs button.on .n{background:var(--brand-50)}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 12px;min-height:44px;outline:none}
.textarea{padding:10px 12px;min-height:84px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.help{font-size:12px;color:var(--text-3);margin-top:4px}
.field{margin-bottom:14px}
.check{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--g4);flex:none;background:var(--surface)}
.check.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--g4);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--brand)}.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--g3);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)}.toggle.on::after{left:21px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stepper button{width:32px;height:32px;display:grid;place-items:center}
.stepper button:hover{background:var(--g2)}
.stepper span{min-width:34px;text-align:center;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:32px}
.listrow{display:flex;align-items:center;gap:12px;padding:14px 12px;background:var(--surface);border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.listrow:hover{background:var(--surface-2)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r);font-size:13px;align-items:flex-start}
.alert.info{background:var(--info-50);color:var(--info)}
.alert.ok{background:var(--ok-50);color:var(--ok)}
.alert.warn{background:var(--warn-50);color:var(--warn)}
.alert.err{background:var(--err-50);color:var(--err)}
.alert.brand{background:var(--brand-50);color:var(--brand)}
.alert .ic{margin-top:1px}
.alert b{font-weight:700}
.divider{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv span:first-child{color:var(--text-2)}
.empty{padding:40px 24px;text-align:center;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .art{font-size:48px;width:96px;height:96px;border-radius:50%;background:var(--g2);display:grid;place-items:center}
.skel{background:linear-gradient(90deg,var(--g2) 25%,var(--g1) 37%,var(--g2) 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:6px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.prog{height:6px;border-radius:99px;background:var(--accent-50);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* banner, shortcuts */
.banner{margin:8px 12px 0;border-radius:var(--r-lg);padding:18px;color:#fff;background:linear-gradient(120deg,#0B7A63,#0F9A7C 55%,#2BB28F);position:relative;overflow:hidden;cursor:pointer;text-align:left;display:block;width:calc(100% - 24px)}
.banner::after{content:"10.10";position:absolute;right:-6px;bottom:-22px;font-size:88px;font-weight:800;opacity:.14;letter-spacing:-4px}
.banner h3{font-size:20px;font-weight:800;max-width:240px}
.banner p{font-size:12.5px;opacity:.92;margin-top:4px;max-width:250px}
.banner .btn{margin-top:12px;background:#fff;color:#0B7A63;min-height:34px;font-size:13px}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}
.shortcuts button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;text-align:center;line-height:1.25}
.shortcuts .sq{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--g1);border:1px solid var(--line)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.fs-card{width:112px;flex:none;cursor:pointer;text-align:left}
.cd{display:inline-flex;gap:3px;font-variant-numeric:tabular-nums}
.cd b{background:var(--g8);color:var(--surface);border-radius:4px;padding:0 5px;font-size:12px;line-height:20px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center;padding:6px 0;line-height:1.25}
.catgrid .sq{width:52px;height:52px;border-radius:50%;background:var(--brand-50);display:grid;place-items:center;font-size:24px}

/* detail */
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--surface)}
.gallery::-webkit-scrollbar{display:none}
.gallery>div{flex:none;width:100%;scroll-snap-align:start}
.gallery .pimg{border-radius:0;--e:120px}
.float-head{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 10px;z-index:4;pointer-events:none}
.float-head .iconbtn{background:rgba(0,0,0,.35);color:#fff;pointer-events:auto}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.trust div{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.trust .ic{color:var(--brand);width:16px;height:16px}
.chart-wrap svg{display:block;width:100%;height:auto}
.rbar{display:flex;align-items:center;gap:6px;font-size:12px}
.rbar .bar{flex:1;height:6px;background:var(--g2);border-radius:99px;overflow:hidden}
.rbar .bar i{display:block;height:100%;background:#E9A23B}
.review{padding:12px 0;border-bottom:1px solid var(--line)}
.review:last-child{border:0}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--brand-100);color:var(--brand)}
.thumbs{display:flex;gap:6px;margin-top:8px}
.thumbs .pimg{width:64px;--e:26px}
.seller-reply{background:var(--surface-2);border-left:3px solid var(--brand);padding:8px 10px;margin-top:8px;font-size:13px;border-radius:0 6px 6px 0}

/* sheet & toast */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .15s}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;max-height:85%;overflow-y:auto;padding:8px 16px 24px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--g3);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}

function buildLog(o){
  const S=['cho_xac_nhan','cho_lay_hang','dang_giao','da_giao','hoan_thanh'];
  const idx=S.indexOf(o.status);const t=o.created;const H=3600e3;const L=[];
  L.push({t,text:'Đơn hàng đã được đặt. Sàn đang giữ tiền thanh toán.'});
  if(o.status==='da_huy'){L.push({t:t+H,text:'Đơn đã hủy: '+(o.cancel||'')});return L.reverse();}
  const lim=o.status==='tra_hang'||o.status==='da_hoan_tien'?3:idx;
  if(lim>=1)L.push({t:t+2*H,text:'Người bán đã xác nhận đơn, đang đóng gói.'});
  if(lim>=2){L.push({t:t+8*H,text:'Đã giao cho đơn vị vận chuyển GHN. Mã vận đơn GHN'+o.id.slice(-6)});L.push({t:t+20*H,text:'Đơn hàng đang trên đường giao đến bạn.'});}
  if(lim>=3)L.push({t:t+36*H,text:'Giao hàng thành công.'});
  if(o.status==='hoan_thanh')L.push({t:t+40*H,text:'Người mua xác nhận đã nhận hàng đúng mô tả. Sàn giải ngân cho người bán.'});
  if(o.status==='tra_hang')L.push({t:t+48*H,text:'Người mua yêu cầu trả hàng / hoàn tiền.'});
  return L.reverse();
}

/* shared components */
function pimg(p,opt={}){const ph=photosOf(p);const id=ph.length?ph[(p._k||0)%ph.length]:'';const e=opt.e||40;const w=e>=90?720:e>=36?360:200;return `<div class="pimg">${imgTag(id,w,esc(p.name||''))}${opt.disc&&disc(p)?`<span class="disc">-${disc(p)}%</span>`:''}${opt.vid&&p.video?`<span class="vid">${ic('play','sm')} Video</span>`:''}</div>`}
function pbadges(p,max=3){const sh=shopOf(p.shop);const b=[];
  if(sh.verified)b.push(`<span class="bdg ver">${ic('shield','sm')}Đã định danh</span>`);
  if(p.auth)b.push(`<span class="bdg auth">Chính hãng</span>`);
  if(p.fast)b.push(`<span class="bdg fast">Giao 2h</span>`);
  if(!sh.verified)b.push(`<span class="bdg gray">Chưa định danh</span>`);
  return `<div class="badges">${b.slice(0,max).join('')}</div>`}
function pcard(p){const sh=shopOf(p.shop);return `<button class="pcard" onclick="go('b','product',{id:'${p.id}'})">${pimg(p,{disc:1,vid:1})}<div class="body"><div class="name clamp2">${esc(p.name)}</div>${pbadges(p,2)}<div class="row gap4" style="margin-top:auto"><span class="price">${fmt(p.price)}</span>${p.orig?`<span class="strike">${fmt(p.orig)}</span>`:''}</div><div class="meta"><span>${p.rating?`<span class="stars">★</span> ${p.rating} · Đã bán ${soldFmt(p.sold)}`:'<span class="bdg acc">Mới</span>'}</span><span>${esc(sh.city)}</span></div></div></button>`}
function priceStats(p){const h=p.history;const min=Math.min(...h),max=Math.max(...h),avg=h.reduce((a,b)=>a+b,0)/h.length;
  // phát hiện tăng rồi giảm: so sánh max của 14 ngày gần nhất với trung bình 14 ngày trước đó
  const early=h.slice(0,15).reduce((a,b)=>a+b,0)/15;const hike=Math.round((max/early-1)*100);
  const fake=hike>30&&p.price<=early*1.05;
  return{min,max,avg,hike,fake,early,vsAvg:Math.round((1-p.price/avg)*100)}}
function priceChart(p,w=340,hgt=120){
  const h=p.history,min=Math.min(...h)*0.95,max=Math.max(...h)*1.03,pad=6;
  const X=i=>pad+i*(w-pad*2)/(h.length-1),Y=v=>hgt-18-(v-min)/(max-min)*(hgt-30);
  const d=h.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const st=priceStats(p);const col=st.fake?'var(--err)':'var(--brand)';
  return `<svg viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Biểu đồ giá 30 ngày">
   <line x1="${pad}" x2="${w-pad}" y1="${Y(st.avg)}" y2="${Y(st.avg)}" stroke="var(--g4)" stroke-dasharray="3 3"/>
   <text x="${w-pad}" y="${Y(st.avg)-4}" text-anchor="end" font-size="9" fill="var(--text-3)">TB ${fmtK(st.avg)}</text>
   <path d="${d} L${X(h.length-1)} ${hgt-18} L${X(0)} ${hgt-18}Z" fill="${col}" opacity=".08"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${X(h.length-1)}" cy="${Y(h[h.length-1])}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
   <text x="${pad}" y="${hgt-4}" font-size="9" fill="var(--text-3)">30 ngày trước</text><text x="${w/2}" y="${hgt-4}" font-size="9" fill="var(--text-3)" text-anchor="middle">15 ngày</text><text x="${w-pad}" y="${hgt-4}" font-size="9" fill="var(--text-3)" text-anchor="end">Hôm nay</text></svg>`}
function barChart(vals,labels,{w=600,h=200,color='var(--brand)',fmtv=fmtK}={}){
  const max=Math.max(...vals)*1.1||1,n=vals.length,bw=(w-40)/n;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${[0,.5,1].map(f=>`<line x1="36" x2="${w}" y1="${h-22-(h-36)*f}" y2="${h-22-(h-36)*f}" stroke="var(--line)"/><text x="30" y="${h-19-(h-36)*f}" font-size="10" text-anchor="end" fill="var(--text-3)">${fmtv(max*f)}</text>`).join('')}
  ${vals.map((v,i)=>{const bh=(h-36)*v/max;return `<rect x="${40+i*bw+bw*.18}" y="${h-22-bh}" width="${bw*.64}" height="${bh}" rx="3" fill="${color}" opacity="${i===n-1?1:.75}"><title>${labels[i]}: ${fmtv(v)}</title></rect>${n<=16||i%3===0?`<text x="${40+i*bw+bw/2}" y="${h-6}" font-size="10" text-anchor="middle" fill="var(--text-3)">${labels[i]}</text>`:''}`}).join('')}</svg>`}

/* fees */
function feeCalc(price,cat,opts={}){const f=S.fees;const fixed=price*(f.cats[cat]??5)/100;const pay=price*f.pay/100;
  const fs=opts.freeship?Math.min(price*f.freeship/100,f.freeshipCap):0;const tax=price*f.tax/100;const totalFee=fixed+pay+fs+tax;
  return{fixed,pay,fs,tax,totalFee,net:price-totalFee,pct:price?totalFee/price*100:0}}
function orderNet(o){const sh=shopOf(o.shop);let net=0,fee=0;o.items.forEach(i=>{const p=P(i.pid);const c=feeCalc(i.price*i.qty,p.cat,{freeship:sh.freeship});net+=c.net;fee+=c.totalFee});return{net:net-o.vShop,fee}}

/* router */
function go(r,n,p={},replace){const st=S[r];if(!replace&&!(st.route.n===n&&JSON.stringify(st.route.p)===JSON.stringify(p)))st.hist.push(st.route);if(st.hist.length>40)st.hist.shift();st.route={n,p};UI.sheet=null;UI.notifOpen=null;
  if(S.mode!=='split'&&S.mode!==r){S.mode=r;mount();return}
  if(S.mode==='split'&&r!=='b'&&S.splitRight!==r){S.splitRight=r;mount();return}
  refresh(r,true)}
function back(r){const st=S[r];st.route=st.hist.pop()||{n:r==='b'?'home':'dashboard',p:{}};UI.sheet=null;refresh(r,true)}
function setMode(m){S.mode=m;UI.sheet=null;UI.notifOpen=null;mount()}
function notify(role,text,link,kind='order'){S.notifs.unshift({role,text,t:Date.now(),read:false,link,kind})}
function unread(role){return S.notifs.filter(n=>n.role===role&&!n.read).length}

/* toast/sheet/modal */
function toast(msg,icon='check'){const host=$('#toasts');const el=document.createElement('div');el.className='toast';el.innerHTML=ic(icon,'sm')+'<span>'+msg+'</span>';host.appendChild(el);setTimeout(()=>el.remove(),2600)}
function closeSheet(){UI.sheet=null;refresh('b')}
function openModal(html,wide){UI.modal={html,wide};renderModal()}
function closeModal(){UI.modal=null;renderModal()}
function renderModal(){const host=$('#modalHost');if(!UI.modal){host.innerHTML='';return}

function mHead(t){return `<div class="modal-h"><h3>${t}</h3><button class="iconbtn" onclick="closeModal()" aria-label="Đóng">${ic('x')}</button></div>`}

/* ============ ORDER ACTIONS (xuyên vai trò) ============ */
function addLog(o,text){o.log.unshift({t:Date.now(),text})}
function setStatus(id,st,extra){const o=S.orders.find(x=>x.id===id);if(!o)return;const prev=o.status;o.status=st;
  const B=o.buyerId==='u1';
  if(st==='cho_lay_hang'){addLog(o,'Người bán đã xác nhận đơn, đang đóng gói.');if(B)notify('b',`Shop đã xác nhận đơn <b>${o.id}</b>, đang chuẩn bị hàng.`,['orderDetail',{id}])}
  if(st==='dang_giao'){addLog(o,'Đã giao cho đơn vị vận chuyển GHN. Mã vận đơn GHN'+o.id.slice(-6));if(B)notify('b',`Đơn <b>${o.id}</b> đã được giao cho đơn vị vận chuyển.`,['orderDetail',{id}])}
  if(st==='da_giao'){addLog(o,'Giao hàng thành công.');if(B)notify('b',`Đơn <b>${o.id}</b> đã giao thành công. Bấm <b>Đã nhận hàng</b> để hoàn tất.`,['orderDetail',{id}]);notify('s',`Đơn <b>${o.id}</b> đã giao thành công, chờ người mua xác nhận để giải ngân.`,['orderDetail',{id}])}
  if(st==='hoan_thanh'){addLog(o,'Người mua xác nhận đã nhận hàng đúng mô tả. Sàn giải ngân cho người bán.');notify('s',`Người mua xác nhận đơn <b>${o.id}</b>. Đã giải ngân <b>${fmt(orderNet(o).net)}</b> vào số dư.`,['finance',{}],'wallet')}
  if(st==='da_huy'){o.cancel=extra;addLog(o,'Đơn đã hủy: '+extra);if(B&&prev!=='cho_xac_nhan')notify('b',`Đơn <b>${o.id}</b> đã bị hủy: ${esc(extra)}. Tiền sẽ hoàn về trong 24h.`,['orderDetail',{id}]);
    if(extra&&extra.startsWith('Người mua'))notify('s',`Người mua đã hủy đơn <b>${o.id}</b> trước khi shop xác nhận.`,['orderDetail',{id}]);
    o.items.forEach(i=>{const p=P(i.pid);p.stock+=i.qty})}
  save()}
function placeOrders(groups,pay,addr,platV,useXu){
  const ids=[];const now=Date.now();let xuLeft=useXu?S.b.xu:0;
  const allSub=groups.reduce((a,g)=>a+g.sub,0);
  groups.forEach((g,gi)=>{
    const id='RO'+String(2610110+S.orders.length*7+gi);
    const vPlat=Math.round(platV.amt*g.sub/allSub);
    const o={id,buyer:addr,buyerId:'u1',shop:g.shop,items:g.items.map(c=>({pid:c.pid,qty:c.qty,variant:c.variant,price:c.price})),status:'cho_xac_nhan',created:now,ship:g.ship,shipDisc:g.shipDisc,vShop:g.vShop,vPlat,xu:0,pay,reviewed:false,log:[],isNew:true};
    const tmp=total(o);const x=Math.min(xuLeft,tmp);o.xu=x;xuLeft-=x;
    o.log=[{t:now,text:'Đơn hàng đã được đặt. Sàn đang giữ tiền thanh toán.'}];
    S.orders.unshift(o);ids.push(id);

    if(f.min&&x.price<f.min)return false;if(f.max&&x.price>f.max)return false;if(f.rating&&x.rating<f.rating)return false;
    if(f.loc&&f.loc.length&&!f.loc.includes(shopOf(x.shop).city))return false;if(f.fast&&!x.fast)return false;if(f.ver&&!shopOf(x.shop).verified)return false;if(f.auth&&!x.auth)return false;return true});
  const s=p.sort||'rel';
  if(s==='best')r.sort((a,b)=>b.sold-a.sold);else if(s==='new')r.sort((a,b)=>+b.id.slice(1)-+a.id.slice(1));else if(s==='asc')r.sort((a,b)=>a.price-b.price);else if(s==='desc')r.sort((a,b)=>b.price-a.price);
  else r.sort((a,b)=>(b.rating*Math.log(b.sold+2)*(shopOf(b.shop).verified?1.2:1))-(a.rating*Math.log(a.sold+2)*(shopOf(a.shop).verified?1.2:1)));
  return r}

function cartCalc(){const sel=S.b.cart.filter(c=>c.on&&P(c.pid));const map={};
  sel.forEach(c=>{const p=P(c.pid);(map[p.shop]=map[p.shop]||{shop:p.shop,items:[],sub:0}).items.push({...c,price:ep(p)});map[p.shop].sub+=ep(p)*c.qty});
  const groups=Object.values(map);S.b.shopV=S.b.shopV||{};S.b.shipOpt=S.b.shipOpt||{};
  groups.forEach(g=>{const v=shopVouchers(g.shop).find(v=>v.code===S.b.shopV[g.shop]);g.v=v;g.vShop=vAmt(v,g.sub);const allFast=g.items.every(i=>P(i.pid).fast);g.canFast=allFast;g.opt=allFast&&S.b.shipOpt[g.shop]==='fast'?'fast':'std';g.ship=g.opt==='fast'?35000:15000;g.shipDisc=0});
  const sub=groups.reduce((a,g)=>a+g.sub,0);const ship=groups.reduce((a,g)=>a+g.ship,0);const vShop=groups.reduce((a,g)=>a+g.vShop,0);
  let sd=S.b.shipV&&groups.length?Math.min(30000,ship):0;const shipDisc=sd;groups.forEach(g=>{const d=Math.min(sd,g.ship);g.shipDisc=d;sd-=d});
  const pv=VOUCHERS_PLAT.find(v=>v.code===S.b.platV);const vPlat=pv?vAmt(pv,sub-vShop):0;
  const before=sub+ship-shipDisc-vShop-vPlat;const xu=S.b.useXu?Math.min(S.b.xu,before):0;
  const qty=sel.reduce((a,c)=>a+c.qty,0);
  return{groups,sub,ship,shipDisc,vShop,vPlat,plat:pv,xu,total:Math.max(0,before-xu),saved:vShop+vPlat+shipDisc+xu,qty}}
function cartToggle(i){S.b.cart[i].on=!S.b.cart[i].on;refresh('b')}
function cartShopToggle(shop){const items=S.b.cart.filter(c=>P(c.pid).shop===shop);const all=items.every(c=>c.on);items.forEach(c=>c.on=!all);refresh('b')}
function cartQty(i,d){const c=S.b.cart[i];c.qty=Math.max(1,Math.min(P(c.pid).stock,c.qty+d));refresh('b')}
function cartDel(i){S.b.cart.splice(i,1);toast('Đã xóa khỏi giỏ','trash');refresh('b')}
BS.cart=()=>{const cart=S.b.cart;const calc=cartCalc();const shops=[...new Set(cart.map(c=>P(c.pid).shop))];const allOn=cart.length&&cart.every(c=>c.on);
  const rec=visibleProducts().filter(p=>!cart.some(c=>c.pid===p.id)).sort((a,b)=>b.sold-a.sold).slice(0,6);
  if(!cart.length)return{tab:'cart',head:`<div class="apphead"><h2 style="padding-left:8px">Giỏ hàng</h2></div>`,body:`<div class="empty"><div class="art"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg></div><div class="md b">Giỏ hàng đang trống</div><p class="sm">Khám phá deal 10.10 với giá thật, giảm thật.</p><button class="btn pri" onclick="go('b','home')">Mua sắm ngay</button></div><div class="section"><div class="section-h"><h3>Có thể bạn thích</h3></div><div class="pgrid">${rec.map(pcard).join('')}</div></div>`};
  return{tab:'cart',head:`<div class="apphead"><h2 style="padding-left:8px">Giỏ hàng (${cart.reduce((a,c)=>a+c.qty,0)})</h2><button class="link" onclick="go('b','chatList')">${ic('chat','sm')}</button></div>`,
  body:shops.map(sid=>{const sh=shopOf(sid);const items=cart.map((c,i)=>({...c,i})).filter(c=>P(c.pid).shop===sid);const g=calc.groups.find(g=>g.shop===sid);const on=items.every(c=>c.on);const sv=shopVouchers(sid);
   return `<div class="section"><div class="row"><button class="check ${on?'on':''}" onclick="cartShopToggle('${sid}')" aria-label="Chọn shop">${on?ic('check','sm'):''}</button><button class="row grow gap4" onclick="go('b','shop',{id:'${sid}'})">${ic('store','sm')}<b>${esc(sh.name)}</b>${sh.verified?`<span class="bdg ver">${ic('shield','sm')}</span>`:''}${ic('chev','sm')}</button></div>
   ${items.map(c=>{const p=P(c.pid);return `<div class="row mt12" style="align-items:flex-start"><button class="check ${c.on?'on':''}" onclick="cartToggle(${c.i})" style="margin-top:28px" aria-label="Chọn">${c.on?ic('check','sm'):''}</button><button style="width:76px;flex:none" onclick="go('b','product',{id:'${p.id}'})">${pimg(p,{e:34})}</button><div class="grow"><div class="sm clamp2">${esc(p.name)}</div>${c.variant?`<span class="bdg gray mt4">${c.variant}</span>`:''}<div class="row between mt8"><div><span class="price">${fmt(ep(p))}</span>${p.orig?` <span class="strike">${fmt(p.orig)}</span>`:''}</div><div class="stepper"><button onclick="cartQty(${c.i},-1)" aria-label="Giảm">${ic('minus','sm')}</button><span>${c.qty}</span><button onclick="cartQty(${c.i},1)" aria-label="Tăng">${ic('plus','sm')}</button></div></div><button class="xs faint mt4 row gap4" onclick="cartDel(${c.i})">${ic('trash','sm')} Xóa</button></div></div>`}).join('')}
   ${sv.length?`<button class="row mt12 sm" style="width:100%;padding-top:10px;border-top:1px solid var(--line)" onclick="openSheet('shopV',{shop:'${sid}'})">${ic('tag','sm')}<span class="grow" style="text-align:left">${g&&g.v?`<b style="color:var(--accent)">Đã áp dụng ${g.v.name}</b>${g.vShop?'':' <span class="xs warn">(chưa đủ điều kiện)</span>'}`:'Voucher của shop'}</span><span class="link">${g&&g.v?'Đổi':'Chọn'} ${ic('chev','sm')}</span></button>`:''}</div>`}).join('')+
  `<div class="section"><button class="row" style="width:100%" onclick="openSheet('platV')">${ic('tag','sm')}<span class="grow b" style="text-align:left">Voucher sàn Rõ</span><span class="sm" style="color:var(--accent)">${calc.plat?'-'+fmt(calc.vPlat):''}${S.b.shipV?' · Freeship':''}</span>${ic('chev','sm')}</button></div>
  <div class="section"><div class="section-h"><h3>Thường được mua cùng</h3></div><div class="hscroll">${rec.map(p=>`<div style="width:120px;flex:none">${pimg(p,{e:36})}<div class="xs clamp2 mt4">${esc(p.name)}</div><div class="row between"><span class="price sm">${fmtK(p.price)}</span><button class="iconbtn" style="width:30px;height:30px;background:var(--brand-50);color:var(--brand)" onclick="addToCart('${p.id}','${p.variants[0]||''}',1,true);refresh('b')" aria-label="Thêm">${ic('plus','sm')}</button></div></div>`).join('')}</div></div><div style="height:12px"></div>`,
  bottom:`<div class="sticky-bot" style="padding-bottom:10px"><button class="row gap4 sm" onclick="const v=!${allOn};S.b.cart.forEach(c=>c.on=v);refresh('b')"><span class="check ${allOn?'on':''}">${allOn?ic('check','sm'):''}</span>Tất cả</button><div class="grow" style="text-align:right"><div class="sm">Tổng: <b class="price md">${fmt(calc.total)}</b></div>${calc.saved?`<div class="xs" style="color:var(--accent)">Tiết kiệm ${fmt(calc.saved)}</div>`:'<div class="xs faint">Đã gồm phí ship</div>'}</div><button class="btn acc" ${calc.qty?'':'disabled'} onclick="go('b','checkout')">Mua hàng (${calc.qty})</button></div>`}};
SHEETS.shopV=p=>{const sub=(cartCalc().groups.find(g=>g.shop===p.shop)||{sub:0}).sub;return `<div class="md bb">Voucher của ${esc(shopOf(p.shop).name)}</div><div class="col mt12">${shopVouchers(p.shop).map(v=>{const ok=sub>=v.min;const on=S.b.shopV[p.shop]===v.code;return `<button class="row" style="border:1px solid ${on?'var(--accent)':'var(--line)'};border-radius:8px;padding:10px;text-align:left;opacity:${ok?1:.55}" onclick="S.b.shopV['${p.shop}']=${on?'null':`'${v.code}'`};closeSheet()"><div style="width:56px;height:56px;border-radius:6px;background:var(--accent-50);color:var(--accent);display:grid;place-items:center">${ic('tag','lg')}</div><div class="grow"><b>${v.name}</b><div class="xs muted">Đơn tối thiểu ${fmt(v.min)}${ok?'':` · mua thêm ${fmt(v.min-sub)}`}</div></div><span class="radio ${on?'on':''}"></span></button>`}).join('')}</div>`};
SHEETS.platV=()=>{const c=cartCalc();const base=c.sub-c.vShop;return `<div class="md bb">Voucher sàn</div><p class="xs muted">Chọn 1 mã giảm giá + 1 mã miễn phí vận chuyển.</p><div class="col mt12">${VOUCHERS_PLAT.map(v=>{const isShip=v.type==='ship';const on=isShip?S.b.shipV:S.b.platV===v.code;const ok=base>=v.min;
  return `<button class="row" style="border:1px solid ${on?'var(--brand)':'var(--line)'};border-radius:8px;padding:10px;text-align:left;opacity:${ok?1:.55}" ${ok?'':'disabled'} onclick="${isShip?`S.b.shipV=${!on}`:`S.b.platV=${on?'null':`'${v.code}'`}`};refresh('b')"><div style="width:56px;height:56px;border-radius:6px;background:${isShip?'var(--ok-50)':'var(--brand-50)'};color:${isShip?'var(--ok)':'var(--brand)'};display:grid;place-items:center">${ic(isShip?'truck':'tag','lg')}</div><div class="grow"><b>${v.name}</b><div class="xs muted">${v.desc} · HSD ${v.end}</div>${ok?'':`<div class="xs" style="color:var(--warn)">Mua thêm ${fmt(v.min-base)} để dùng</div>`}</div><span class="${isShip?'check':'radio'} ${on?'on':''}">${isShip&&on?ic('check','sm'):''}</span></button>`}).join('')}</div><button class="btn pri block mt16" onclick="closeSheet()">Xong</button>`};

  <div class="section"><div class="b">Phương thức thanh toán</div>${PAYS.map(([k,l,i])=>`<button class="row" style="width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left" onclick="S.b.pay='${k}';refresh('b')">${ic(i)}<span class="grow sm">${l}</span><span class="radio ${pay===k?'on':''}"></span></button>`).join('')}</div>

  bottom:`<div class="sticky-bot" style="padding-bottom:16px"><div class="grow"><div class="xs muted">Tổng thanh toán (đã gồm ship & voucher)</div><div class="price lg">${fmt(c.total)}</div>${c.saved?`<div class="xs" style="color:var(--accent)">Tiết kiệm ${fmt(c.saved)}</div>`:''}</div><button class="btn acc" style="min-width:130px" onclick="placeOrder()">Đặt hàng</button></div>`}};
SHEETS.addr=()=>`<div class="md bb">Địa chỉ nhận hàng</div><div class="col mt12">${S.b.addresses.map((a,i)=>`<button class="row" style="border:1px solid ${S.b.addrIdx===i?'var(--brand)':'var(--line)'};border-radius:8px;padding:10px;text-align:left;align-items:flex-start" onclick="S.b.addrIdx=${i};closeSheet()"><span class="radio ${S.b.addrIdx===i?'on':''}" style="margin-top:2px"></span><div><b>${esc(a.name)}</b> · ${esc(a.phone)}<div class="sm muted">${esc(a.line)}</div></div></button>`).join('')}</div><button class="btn sec block mt12" onclick="UI.sheet=null;go('b','account',{sec:'address'})">${ic('plus','sm')} Thêm địa chỉ mới</button>`;
function placeOrder(){if(!S.b.loggedIn){toast('Vui lòng đăng nhập để đặt hàng','lock');go('b','login',{next:'checkout'});return}
  const c=cartCalc();if(!c.groups.length)return;
  if((S.b.pay||'COD')!=='COD'){openSheet('paying');setTimeout(()=>finishOrder(c),1300)}else finishOrder(c)}
SHEETS.paying=()=>`<div class="empty" style="padding:24px"><div class="art"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.3"/></svg></div><div class="md b">Đang xử lý thanh toán…</div><p class="sm">Mô phỏng cổng thanh toán ${esc(S.b.pay)}. Không trừ tiền thật.</p><div class="skel" style="height:8px;width:100%"></div></div>`;
function finishOrder(c){UI.sheet=null;const a=S.b.addresses[S.b.addrIdx];
  const ids=placeOrders(c.groups,S.b.pay||'COD',a,{amt:c.vPlat},S.b.useXu);
  const usedV=c.vShop||c.vPlat||c.shipDisc;
  const fryer=c.groups.some(g=>g.items.some(i=>/Nồi chiên không dầu/.test(P(i.pid).name)&&i.price<1500000));
  S.b.cart=S.b.cart.filter(x=>!x.on);S.b.platV=null;S.b.shipV=false;S.b.useXu=false;
  go('b','success',{ids,total:c.total});
  if(UI.timer&&UI.timer.i===0&&fryer)stopTimer(false,usedV?'Đã mua nồi chiên dưới 1,5 triệu có dùng voucher':'Đã mua nồi chiên dưới 1,5 triệu nhưng CHƯA dùng voucher');
  refresh('b')}

const myOrders=()=>S.orders.filter(o=>o.buyerId==='u1');
const inTab=(o,t)=>t==='all'||(t==='tra'?['tra_hang','da_hoan_tien','da_huy'].includes(o.status):o.status===t);
function buyerActions(o,compact){const a=[];const s=o.status;
  if(s==='cho_xac_nhan')a.push(`<button class="btn ghost sm" onclick="event.stopPropagation();openSheet('cancel',{id:'${o.id}'})">Hủy đơn</button>`);
  if(s==='dang_giao')a.push(`<button class="btn sim sm" onclick="event.stopPropagation();setStatus('${o.id}','da_giao');toast('Mô phỏng: ĐVVC giao thành công','truck');refresh('b')">Mô phỏng: giao thành công</button>`);
  if(s==='da_giao'){a.push(`<button class="btn ghost sm" onclick="event.stopPropagation();go('b','return',{id:'${o.id}'})">Trả hàng/Hoàn tiền</button>`);a.push(`<button class="btn pri sm" onclick="event.stopPropagation();openSheet('received',{id:'${o.id}'})">Đã nhận hàng</button>`)}
  if(s==='hoan_thanh'&&!o.reviewed)a.push(`<button class="btn acc sm" onclick="event.stopPropagation();go('b','review',{id:'${o.id}'})">Đánh giá</button>`);
  if(s==='hoan_thanh'||s==='da_huy'||s==='da_hoan_tien')a.push(`<button class="btn sec sm" onclick="event.stopPropagation();o_buyAgain('${o.id}')">Mua lại</button>`);
  if(!compact)a.unshift(`<button class="btn ghost sm" onclick="event.stopPropagation();go('b','chat',{shop:'${o.shop}'})">${ic('chat','sm')} Chat shop</button>`);
  return a.join('')}
function o_buyAgain(id){const o=S.orders.find(x=>x.id===id);S.b.cart.forEach(c=>c.on=false);o.items.forEach(i=>addToCart(i.pid,i.variant,i.qty,true));go('b','cart')}

BS.orderDetail=p=>{const o=S.orders.find(x=>x.id===p.id);if(!o)return BS.orders({});const sh=shopOf(o.shop);

  <div class="section"><div class="b row gap4">${ic('truck','sm')} Thông tin vận chuyển</div><div class="xs muted mt4">GHN · ${o.status==='cho_xac_nhan'||o.status==='cho_lay_hang'?'Chưa có mã vận đơn':'GHN'+o.id.slice(-6)}</div><div class="tl mt8">${o.log.map(l=>`<div>${esc(l.text)}<div class="xs faint">${dt(l.t)}</div></div>`).join('')}</div></div>

   ${o.items.map(i=>{const x=P(i.pid);return `<button class="row mt12" style="width:100%;text-align:left" onclick="go('b','product',{id:'${x.id}'})"><div style="width:56px">${pimg(x,{e:26})}</div><div class="grow"><div class="sm clamp2">${esc(x.name)}</div><div class="row between xs muted"><span>${i.variant} x${i.qty}</span><span>${fmt(i.price)}</span></div></div></button>`}).join('')}
   <div class="divider"></div><div class="kv sm"><span>Tổng tiền hàng</span><span>${fmt(sub(o))}</span></div><div class="kv sm"><span>Phí vận chuyển</span><span>${fmt(o.ship)}</span></div>${o.shipDisc?`<div class="kv sm"><span>Giảm phí vận chuyển</span><span>-${fmt(o.shipDisc)}</span></div>`:''}${o.vShop?`<div class="kv sm"><span>Voucher shop</span><span>-${fmt(o.vShop)}</span></div>`:''}${o.vPlat?`<div class="kv sm"><span>Voucher sàn</span><span>-${fmt(o.vPlat)}</span></div>`:''}${o.xu?`<div class="kv sm"><span>Xu</span><span>-${fmt(o.xu)}</span></div>`:''}

  return{nav:false,head:`<div class="apphead"><button class="iconbtn" onclick="back('b')">${ic('back')}</button><div class="avatar">${logoHTML(sh)}</div><div class="grow"><div class="b sm">${esc(sh.name)}</div><div class="xs" style="color:var(--ok)">● Thường phản hồi trong vài phút</div></div><button class="iconbtn" onclick="go('b','shop',{id:'${sh.id}'})">${ic('store')}</button></div>`,
  body:`${x?`<div class="row" style="margin:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px"><div style="width:44px">${pimg(x,{e:22})}</div><div class="grow"><div class="xs clamp2">${esc(x.name)}</div><div class="price sm">${fmt(ep(x))}</div></div><button class="btn sec sm" onclick="sendChat('${sh.id}','[Sản phẩm] ${esc(x.name)}')">Gửi</button></div>`:''}
  <div class="msgs">${t.msgs.map(m=>`<div class="msg ${m.from==='shop'?'them':'me'}">${m.auto?'<span class="auto">Trả lời tự động</span>':''}${esc(m.text)}<span class="t">${dt(m.t).split(' ')[0]}</span></div>`).join('')||`<div class="empty" style="padding:24px"><span class="sm">Gửi tin nhắn đầu tiên cho shop</span></div>`}</div>`,
  bottom:`<div style="background:var(--surface);border-top:1px solid var(--line)"><div class="chips" style="padding:8px 10px 0">${['Shop ơi, còn hàng không?','Bao lâu thì giao tới Q.3?','Có xuất hóa đơn không?'].map(q=>`<button class="chip" onclick="sendChat('${sh.id}','${q}')">${q}</button>`).join('')}</div><form class="row" style="padding:8px 10px 22px" onsubmit="sendChat('${sh.id}',$('#cmsg').value);return false"><input id="cmsg" class="input" placeholder="Nhập tin nhắn…" autocomplete="off"><button class="btn pri" aria-label="Gửi">${ic('send','sm')}</button></form></div>`}};
function sendChat(shop,text){text=(text||'').trim();if(!text)return;const t=threadFor(shop);const now=Date.now();
  const recentShop=t.msgs.some(m=>m.from==='shop'&&now-m.t<10*60e3);t.msgs.push({from:'buyer',text,t:now});
  if(shop===S.s.shop)notify('s',`Tin nhắn mới từ <b>Huỳnh Thị Lan</b>: “${esc(text.slice(0,50))}”`,['chat',{id:t.id}],'chat');
  refresh('b');const sc=$('#phone-b .scr');if(sc)sc.scrollTop=sc.scrollHeight;
  if(!recentShop){const auto=shop===S.s.shop?(S.s.autoReply.on?S.s.autoReply.text:null):'Cảm ơn bạn đã nhắn tin! Shop sẽ phản hồi trong ít phút.';
    if(auto)setTimeout(()=>{t.msgs.push({from:'shop',text:auto,t:Date.now(),auto:true});refresh('b');const sc=$('#phone-b .scr');if(sc)sc.scrollTop=sc.scrollHeight},900)}
  if(shop!==S.s.shop)setTimeout(()=>{t.msgs.push({from:'shop',text:/giao/i.test(text)?'Dạ đơn nội thành TP.HCM nhận trong 1–2 ngày, có hỏa tốc 2h ạ.':/hàng/i.test(text)?'Dạ sản phẩm còn hàng, bạn đặt ngay nhé!':'Dạ shop đã nhận thông tin ạ 😊',t:Date.now()});refresh('b')},2600)}

const BAN_WORDS=/auth\s*1:1|replica|fake|super ?fake|hàng nhái|nhai|rep 1:1/i;

  <div class="fee-row"><span>Phí thanh toán (${S.fees.pay}%)</span><span>-${fmt(f.pay)}</span></div>
  <div class="fee-row"><span>Phí chương trình Freeship ${sh.freeship?`(${S.fees.freeship}%, tối đa ${fmtK(S.fees.freeshipCap)})`:'(không tham gia)'}</span><span>-${fmt(f.fs)}</span></div>
  <div class="fee-row"><span>Thuế khấu trừ thay hộ KD (${S.fees.tax}%)</span><span>-${fmt(f.tax)}</span></div>
  <div class="fee-row" style="font-size:15px"><b>Bạn thực nhận</b><b style="color:var(--brand)">${fmt(f.net)}</b></div>
  <div class="fee-row"><span>Giá vốn</span><span>-${fmt(cost)}</span></div>
  <div class="fee-row" style="font-size:15px"><b>${profit>=0?'Lãi':'Lỗ'} ước tính / sản phẩm</b><b style="color:${profit>=0?'var(--ok)':'var(--err)'}">${profit>=0?'':'-'}${fmt(Math.abs(profit))}${price?` · ${Math.round(profit/price*100)}%`:''}</b></div>
  ${price&&profit<0?`<div class="alert err mt8">${ic('alert','sm')}<div>Giá bán đang thấp hơn chi phí. Cần tối thiểu <b>${fmt(Math.ceil(cost/(1-f.pct/100)/1000)*1000)}</b> để hòa vốn.</div></div>`:''}
  ${+d.orig&&+d.orig>price?`<div class="alert info mt8">${ic('chart','sm')}<div>Nhãn “-${Math.round((1-price/d.orig)*100)}%” chỉ hiển thị nếu giá gốc khớp lịch sử giá 30 ngày. Tăng giá trên 30% trước khuyến mãi sẽ bị gắn cờ.</div></div>`:''}
  <p class="xs muted mt8">Tổng phí: ${f.pct.toFixed(1).replace('.',',')}% giá bán. Không có phí ẩn, đúng bằng số tiền trong mục Tài chính & đối soát.</p>`}
function previewHTML(d){const fake={id:'pv',name:d.name||'Tên sản phẩm của bạn',cat:d.cat,shop:myShop(),price:+d.price||0,orig:+d.orig>+d.price?+d.orig:0,rating:0,sold:0,fast:true,auth:false,hue:160,video:d.video};
  return `<div style="width:180px;pointer-events:none">${pcard(fake)}</div>`}

  <div class="grid g-main"><div class="col gap16">

    <button style="width:88px;height:88px;border:1.5px dashed ${d.video?'var(--brand)':'var(--g4)'};border-radius:8px;display:grid;place-items:center;color:${d.video?'var(--brand)':'var(--text-3)'};font-size:12px" onclick="UI.tmp.ep.video=!UI.tmp.ep.video;refresh('s')">${ic('play')}${d.video?'Đã có video':'Thêm video'}</button></div><div class="help">Ảnh thật, không lấy ảnh của shop/sàn khác (hệ thống so khớp ảnh trùng). Video hiển thị trong tab Khám phá.</div></div>

    <div class="field"><label class="label">Tên sản phẩm *</label><input class="input" value="${esc(d.name)}" oninput="epSet('name',this.value)" placeholder="Ví dụ: Nồi chiên không dầu 6L cảm ứng"><div class="help">Không dùng từ khóa gây hiểu nhầm như “auth 1:1”, “replica”, sản phẩm sẽ bị chuyển kiểm duyệt.</div></div>

    ${x?`<div class="alert info">${ic('chart','sm')}<div>Mọi thay đổi giá được ghi vào <b>lịch sử giá công khai</b> mà người mua nhìn thấy.</div></div>`:''}</div></div>
   <div class="col gap16" style="position:sticky;top:80px;align-self:start"><div class="card" id="feePanel">${feePanelHTML(d)}</div><div class="card"><div class="card-h"><h3>Xem trước thẻ sản phẩm</h3></div><div id="epPreview">${previewHTML(d)}</div></div></div></div>`}};
function saveProduct(){const d=UI.tmp.ep;if(!d.name.trim()||!+d.price||d.stock===''||!d.imgs){toast(!d.imgs?'Thêm ít nhất 1 ảnh':'Điền đủ tên, giá bán, tồn kho','alert');return}
  const bad=BAN_WORDS.test(d.name);let x=d._id!=='new'&&P(d._id);const isNew=!x;
  if(!x){const n=Math.max(...S.products.map(p=>+p.id.slice(1)))+1;x={id:'p'+n,shop:myShop(),rating:0,sold:0,fast:true,auth:false,hue:Math.floor(Math.random()*360),sku:'SKU-'+String(n).padStart(4,'0'),history:Array(30).fill(+d.price),status:'dang_ban'};S.products.push(x)}
  else if(+d.price!==x.price){x.history=[...x.history.slice(1),+d.price]}
  Object.assign(x,{name:d.name.trim(),cat:d.cat,price:+d.price,orig:+d.orig>+d.price?+d.orig:0,cost:+d.cost||0,stock:+d.stock,variants:d.variants.split(',').map(s=>s.trim()).filter(Boolean),desc:d.desc||DESCS[d.cat],video:d.video});
  if(bad){x.status='cho_duyet';S.flagged.unshift({id:'F-'+(80+S.flagged.length),pid:x.id,reason:'Từ khóa nghi hàng giả trong tên sản phẩm',src:'Hệ thống quét khi đăng',sev:'Cao',status:'cho_xu_ly',created:Date.now()});notify('a',`Sản phẩm mới bị gắn cờ: <b>${esc(x.name)}</b>`,['moderation',{}]);toast('Sản phẩm đang chờ kiểm duyệt do chứa từ khóa vi phạm','alert')}
  else toast(isNew?'Đã đăng bán! Sản phẩm hiển thị ngay với người mua':'Đã lưu thay đổi');
  UI.tmp.ep=null;if(UI.timer&&UI.timer.i===3&&isNew)stopTimer(false,'Đã đăng sản phẩm đầu tiên');go('s','products',{tab:'all'})}
